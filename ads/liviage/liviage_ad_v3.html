<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<title>リビアジェ 広告原稿 v3</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&family=Cormorant+Garamond:wght@500;600&family=Outfit:wght@500;600&display=swap" rel="stylesheet">
<style>
/* 1.5枠 180 x 88mm（仕上がり）／コンセプト：燈（あかり）― 夜にともる、やさしい灯り */
@page{size:180mm 88mm;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:180mm;height:88mm}
body{font-family:'Noto Sans JP',sans-serif;color:#1f2a3c;-webkit-print-color-adjust:exact;print-color-adjust:exact}
:root{--ink:#3a2418;--ink2:#3a2418;--org:#e8742a;--org2:#c9541c;--gold:#e0863e;--gold2:#fff1dc;--paper:#fdf7ef;--line:#efd6bd;--txt:#4a3a30}
.ad{position:relative;width:180mm;height:88mm;overflow:hidden;background:var(--paper)}

/* ===== left : night panel ===== */
.night{position:absolute;left:0;top:0;bottom:0;width:66mm;color:#fff;
  background:
    radial-gradient(34mm 34mm at 52% 40%,rgba(255,236,190,.55),rgba(255,220,160,.15) 55%,transparent 75%),
    linear-gradient(165deg,#f39a45,var(--org) 45%,var(--org2) 100%)}
.night:after{display:none}
.logo{position:absolute;left:6mm;top:6mm;width:13mm;height:13mm;border:.3mm dashed rgba(255,255,255,.85);border-radius:1.5mm;
  display:flex;align-items:center;justify-content:center;font-family:'Outfit';font-size:2.3mm;letter-spacing:.15em;color:#fff}
/* vertical catch */
.v{position:absolute;right:9mm;top:6.5mm;writing-mode:vertical-rl;font-family:'Shippori Mincho',serif;font-weight:700;font-size:6.3mm;line-height:1.75;letter-spacing:.16em;color:#fff}
.v em{font-style:normal;color:#fff3c4}
/* lantern mark */
.lamp{position:absolute;left:22mm;top:24mm;width:14mm;height:20mm}
/* name block */
.nameb{position:absolute;left:6mm;bottom:6mm}
.nameb .en{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:3mm;letter-spacing:.42em;color:#fff3c4}
.nameb .jp{margin-top:.6mm;font-family:'Shippori Mincho',serif;font-weight:800;font-size:9.4mm;letter-spacing:.1em;line-height:1}
.nameb .co{margin-top:1.6mm;font-size:2.35mm;letter-spacing:.08em;color:rgba(255,255,255,.88)}

/* ===== right : content ===== */
.main{position:absolute;left:66mm;right:0;top:0;bottom:0;padding:5.6mm 6mm 0 7mm}
.eyebrow{display:flex;align-items:center;gap:2mm;font-size:2.7mm;font-weight:700;letter-spacing:.2em;color:var(--org2)}
.eyebrow:before{content:'';width:6mm;height:.3mm;background:var(--org)}
h1{margin-top:1.8mm;font-family:'Shippori Mincho',serif;font-weight:800;font-size:6.1mm;line-height:1.35;letter-spacing:.04em;color:var(--ink)}
.worry{margin-top:1.4mm;font-size:2.65mm;line-height:1.6;color:#7a6658}
.svc{margin-top:3.4mm;display:grid;grid-template-columns:repeat(3,1fr);border-top:.3mm solid var(--line);border-left:.3mm solid var(--line)}
.svc div{display:flex;align-items:center;gap:1.8mm;height:8.2mm;padding-left:2.2mm;border-right:.3mm solid var(--line);border-bottom:.3mm solid var(--line);font-size:3.1mm;font-weight:700;color:var(--ink);white-space:nowrap;background:#fff}
.svc i{font-style:normal;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:3.3mm;color:var(--org)}

/* contact row */
.ct{position:absolute;left:7mm;right:6mm;bottom:5.4mm;display:flex;align-items:flex-end;gap:4mm}
.ct .info{flex:1;min-width:0}
.ct .lb{display:flex;align-items:center;gap:2mm;font-size:2.5mm;font-weight:700;color:#8a6a55;letter-spacing:.06em}
.seal{display:inline-flex;align-items:center;gap:1mm;padding:.5mm 2mm;border:0;border-radius:3mm;color:#fff;background:var(--org);font-size:2.4mm;font-weight:900;letter-spacing:.04em}
.tel{margin-top:.8mm;display:flex;align-items:center;gap:1.6mm;font-family:'Outfit',sans-serif;font-weight:600;font-size:7.9mm;line-height:1;letter-spacing:.02em;color:var(--org2);white-space:nowrap}
.tel svg{width:5.2mm;height:5.2mm;flex:none}
.addr{margin-top:1.4mm;font-size:2.5mm;color:var(--txt);line-height:1.5}
.qrs{display:flex;gap:2.2mm}
.qr{width:15.5mm;text-align:center}
.qr .bx{width:15.5mm;height:15.5mm;padding:1.1mm;background:#fff;border:.3mm solid var(--line)}
.qr .bx img{width:100%;height:100%;display:block}
.qr p{margin-top:.7mm;font-family:'Outfit';font-size:2.1mm;font-weight:600;letter-spacing:.12em;color:#8a6a55}
.ph{background:rgba(255,220,90,.35);outline:.3mm dashed #d4a017;padding:0 .6mm;color:#7a5600}
</style></head>
<body><div class="ad">

  <div class="night">
    <div class="logo">LOGO</div>
    <svg class="lamp" viewBox="0 0 70 100" fill="none">
      <defs><radialGradient id="g" cx="50%" cy="55%" r="50%"><stop offset="0" stop-color="#fffbe8"/><stop offset=".6" stop-color="#ffe2a8" stop-opacity=".6"/><stop offset="1" stop-color="#ffe2a8" stop-opacity="0"/></radialGradient></defs>
      <circle cx="35" cy="56" r="34" fill="url(#g)"/>
      <path d="M35 6v10" stroke="#fff6e6" stroke-width="1.6"/>
      <path d="M22 16h26M24 84h22" stroke="#fff6e6" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M24 16c-9 12-9 56 0 68M46 16c9 12 9 56 0 68M35 16v68M28.5 16c-4 14-4 54 0 68M41.5 16c4 14 4 54 0 68" stroke="#fff6e6" stroke-width="1.1" opacity=".85"/>
      <path d="M35 90v6" stroke="#fff6e6" stroke-width="1.6"/>
    </svg>
    <p class="v">大切な品々を、<br><em>想い</em>と一緒に。</p>
    <div class="nameb">
      <div class="en">LIVIAGE</div>
      <div class="jp">リビアジェ</div>
      <div class="co">運営　株式会社燈志</div>
    </div>
  </div>

  <div class="main">
    <div class="eyebrow">お家の片付けなら</div>
    <h1>整理のお悩み、<br>リビアジェにおまかせください。</h1>
    <p class="worry">「整理したいけど、どうしたら…」「片付けに帰ってこられない…」</p>
    <div class="svc">
      <div><i>01</i>遺品整理</div><div><i>02</i>生前整理</div><div><i>03</i>空き家整理・管理</div>
      <div><i>04</i>ゴミ屋敷片付け</div><div><i>05</i>不用品回収</div><div><i>06</i>特殊清掃</div>
    </div>

    <div class="ct">
      <div class="info">
        <div class="lb">ご相談・お問い合わせ <span class="seal">遺品整理士認定</span></div>
        <div class="tel"><svg viewBox="0 0 24 24" fill="#e8742a"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg>080-9142-2824</div>
        <div class="addr"><span class="ph">〒◯◯◯-◯◯◯◯ 鹿児島県志布志市◯◯◯◯</span></div>
      </div>
      <div class="qrs">
        <div class="qr"><div class="bx"><img src="qr_web.svg" alt=""></div><p>WEB</p></div>
        <div class="qr"><div class="bx"><img src="qr_ig.svg" alt=""></div><p>INSTAGRAM</p></div>
      </div>
    </div>
  </div>

</div></body></html>
