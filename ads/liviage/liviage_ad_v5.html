<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<title>リビアジェ 広告原稿 v5</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700;900&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* 180 x 75mm（仕上がり）／ホームページのオレンジ #F8A119・#F79700 */
@page{size:180mm 75mm;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:180mm;height:75mm}
body{font-family:'Noto Sans JP',sans-serif;color:#3b2a1e;-webkit-print-color-adjust:exact;print-color-adjust:exact}
:root{--o1:#f8a119;--o2:#f79700;--o3:#e07a00;--brown:#3b2a1e;--soft:#fff6e6;--line:#f4d9ae}
.ad{position:relative;width:180mm;height:75mm;overflow:hidden;background:#fffdf8}
.wave{position:absolute;left:0;bottom:0;width:180mm;height:35mm}

/* ===== top : 仕事内容 ===== */
.logo{position:absolute;left:6mm;top:5mm;width:27mm;height:27mm;border-radius:50%;background:#fff;box-shadow:0 0 0 .5mm #fff,0 0 0 .9mm var(--o1),0 1.2mm 3mm rgba(200,120,20,.18)}
.logo img{width:100%;height:100%;display:block;border-radius:50%}
.top{position:absolute;left:38mm;right:6mm;top:4.6mm}
.row1{display:flex;align-items:center;justify-content:space-between}
.catch{font-family:'Zen Maru Gothic',sans-serif;font-weight:700;font-size:3.6mm;letter-spacing:.05em;color:var(--brown)}
.catch em{font-style:normal;color:var(--o3)}
.badges{display:flex;gap:1.2mm}
.badges span{font-size:2.5mm;font-weight:900;letter-spacing:.03em;padding:.6mm 2.2mm;border-radius:3mm;color:#fff;background:var(--brown)}
.badges span.o{background:var(--o2)}
.svc{margin-top:2.8mm;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.8mm 1.8mm}
.svc div{display:flex;align-items:center;gap:1.8mm;height:10.4mm;padding:0 2.2mm;border-radius:2mm;background:#fff;border:.35mm solid var(--line);box-shadow:0 .5mm 0 #f6e2c2}
.svc i{flex:none;width:5.2mm;height:5.2mm;border-radius:50%;background:var(--o2);display:flex;align-items:center;justify-content:center}
.svc i svg{width:3.2mm;height:3.2mm}
.svc b{font-weight:900;font-size:4.3mm;letter-spacing:.02em;color:var(--brown);white-space:nowrap;line-height:1}
.svc b small{font-size:3.1mm}

/* ===== bottom : orange ===== */
.band{position:absolute;left:0;right:0;bottom:0;height:28mm;color:#fff;display:flex;align-items:flex-end;padding:0 6mm 4.2mm 7mm;gap:5mm}
.name .sub{font-size:2.4mm;font-weight:700;letter-spacing:.1em;opacity:.95}
.name .nm{margin-top:.6mm;font-family:'Zen Maru Gothic',sans-serif;font-weight:900;font-size:10.6mm;line-height:1;letter-spacing:.06em;text-shadow:0 .4mm 1.4mm rgba(150,70,0,.25)}
.name .co{margin-top:1.4mm;font-size:2.3mm;opacity:.92}
.sep{align-self:stretch;width:.3mm;margin:6mm 0 .4mm;background:rgba(255,255,255,.6)}
.ct{flex:1;min-width:0}
.ct .lb{font-size:2.3mm;font-weight:700;letter-spacing:.08em;opacity:.95;margin-bottom:.6mm}
.ct .num{display:flex;align-items:center;gap:1.4mm;font-family:'Outfit',sans-serif;font-weight:700;font-size:8.4mm;line-height:1;white-space:nowrap;text-shadow:0 .4mm 1.2mm rgba(150,70,0,.25)}
.ct .num svg{width:5.4mm;height:5.4mm;flex:none}
.ct .hr{margin-top:1.3mm;font-size:2.5mm;font-weight:500;white-space:nowrap}
.ct .hr b{display:inline-block;font-weight:700;font-size:2.15mm;padding:.15mm 1.2mm;margin-right:.8mm;border:.25mm solid rgba(255,255,255,.85);border-radius:1mm}
.ct .addr{margin-top:1mm;font-size:2.5mm;font-weight:700;white-space:nowrap}
.qrs{display:flex;gap:1.8mm}
.qr{width:14mm;text-align:center}
.qr .bx{width:14mm;height:14mm;padding:1mm;background:#fff;border-radius:1.2mm}
.qr .bx img{width:100%;height:100%;display:block}
.qr p{margin-top:.5mm;font-family:'Outfit';font-size:2.1mm;font-weight:700;letter-spacing:.06em}
</style></head>
<body><div class="ad">

  <svg class="wave" viewBox="0 0 180 35" preserveAspectRatio="none">
    <defs><linearGradient id="og" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8a119"/><stop offset="1" stop-color="#f08a00"/></linearGradient></defs>
    <path d="M0 9 Q90 -3 180 9 V35 H0 Z" fill="url(#og)"/>
    <path d="M0 6.2 Q90 -5.8 180 6.2" fill="none" stroke="#f8a119" stroke-width=".35" opacity=".55"/>
  </svg>

  <div class="logo"><img src="assets/toji_logo_circle.png" alt="TOJI"></div>

  <div class="top">
    <div class="row1">
      <p class="catch">大切な品々、<em>想いと一緒に</em>お預かりします。</p>
      <div class="badges"><span class="o">九州全域対応</span><span>遺品整理士認定</span></div>
    </div>
    <div class="svc">
      <div><i><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></i><b>遺品整理</b></div>
      <div><i><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></i><b>生前整理</b></div>
      <div><i><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></i><b>不用品回収<small>・買取</small></b></div>
      <div><i><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></i><b>空き家整理<small>・管理</small></b></div>
      <div><i><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></i><b>ゴミ屋敷片付け</b></div>
      <div><i><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></i><b>特殊清掃</b></div>
    </div>
  </div>

  <div class="band">
    <div class="name">
      <div class="sub">遺品・生前整理・不用品買取</div>
      <div class="nm">リビアジェ</div>
      <div class="co">運営　株式会社燈志</div>
    </div>
    <div class="sep"></div>
    <div class="ct">
      <div class="lb">ご相談はお電話・LINEでお気軽に</div>
      <div class="num"><svg viewBox="0 0 24 24" fill="#fff"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg>080-9142-2824</div>
      <div class="hr"><b>営業時間</b>9:00〜20:00　<b>定休日</b>不定休</div>
      <div class="addr">〒898-0005 鹿児島県枕崎市中町1 松田ビル2FA</div>
    </div>
    <div class="qrs">
      <div class="qr"><div class="bx"><img src="qr_web.svg" alt=""></div><p>WEB</p></div>
      <div class="qr"><div class="bx"><img src="qr_ig.svg" alt=""></div><p>Instagram</p></div>
    </div>
  </div>

</div></body></html>
