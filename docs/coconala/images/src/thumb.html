<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<title>ココナラ サービス画像</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* ココナラ推奨 1220x1240。上下約120pxは切れることがあるので、文字は y=140〜1100 の中に置く。右下はバッジが重なるので空ける。 */
:root{--bg1:#050b1a;--bg2:#0b1a3c;--cy:#3CD6F0;--cy2:#4FE3FF;--tx:#F2F6FF;--sub:#B9C6E6;--card:rgba(255,255,255,.06);}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1220px;height:1240px;overflow:hidden;background:var(--bg1)}
body{font-family:"Noto Sans JP",sans-serif;color:var(--tx);position:relative;
  background:radial-gradient(900px 700px at 85% 15%,#16306b 0%,rgba(22,48,107,0) 70%),
             radial-gradient(800px 600px at 0% 100%,#0e2f45 0%,rgba(14,47,69,0) 70%),
             linear-gradient(160deg,var(--bg2),var(--bg1));}
.grid{position:absolute;inset:0;background-image:radial-gradient(rgba(79,227,255,.18) 1.6px,transparent 1.8px);background-size:44px 44px;opacity:.5;
  mask-image:linear-gradient(180deg,#000 0%,transparent 60%);}
.frame{position:absolute;inset:28px;border:2px solid rgba(60,214,240,.25);border-radius:36px}
.top{position:absolute;left:84px;right:84px;top:140px;display:flex;align-items:center;justify-content:space-between}
.logo{height:46px}
.tag{font-weight:700;font-size:36px;letter-spacing:.04em;color:#04101c;background:linear-gradient(90deg,var(--cy2),#9fd8ff);padding:10px 30px;border-radius:999px}
h1{position:absolute;left:84px;right:60px;top:226px;font-weight:900;font-size:128px;line-height:1.16;letter-spacing:-.01em}
h1 .em{background:linear-gradient(90deg,#7ff0ff,var(--cy) 50%,#7fb6ff);-webkit-background-clip:text;background-clip:text;color:transparent}
h1 small{display:block;font-size:52px;font-weight:700;color:var(--sub);letter-spacing:.02em;margin-top:14px;line-height:1.3}
.pts{position:absolute;left:84px;top:662px;width:560px;display:flex;flex-direction:column;gap:18px}
.pt{display:flex;align-items:center;gap:18px;font-size:46px;font-weight:700;line-height:1.2}
.pt i{flex:none;width:52px;height:52px;border-radius:50%;background:var(--cy);display:grid;place-items:center}
.pt i:after{content:"";width:22px;height:12px;border-left:6px solid #04101c;border-bottom:6px solid #04101c;transform:translateY(-3px) rotate(-45deg)}
.vis{position:absolute;right:70px;top:610px;width:500px;height:420px}
.vis svg{overflow:visible}
.price{position:absolute;left:84px;top:945px;display:flex;align-items:baseline;gap:14px;
  background:rgba(4,12,28,.75);border:3px solid var(--cy);border-radius:24px;padding:10px 34px 14px}
.price .pre{font-size:40px;font-weight:700;color:var(--sub)}
.price .num{font-size:88px;font-weight:900;letter-spacing:-.01em;line-height:1.05}
.price .yen{font-size:48px;font-weight:900}
.note{position:absolute;left:90px;top:1068px;font-size:28px;font-weight:500;color:var(--sub)}
</style></head>
<body>
<div class="grid"></div><div class="frame"></div>
<div class="top"><img class="logo" src="logo.svg" alt=""><div class="tag" id="tag"></div></div>
<h1 id="h1"></h1>
<div class="pts" id="pts"></div>
<div class="vis" id="vis"></div>
<div class="price" id="price"></div>
<div class="note" id="note"></div>
<script>

ai:{tag:'生成AIレッスン',h1:'生成AIを<br><span class="em">仕事で使う</span><small>1対1・オンライン60分</small>',

const k=new URLSearchParams(location.search).get('s')||'reel', d=D[k];

document.getElementById('h1').innerHTML=d.h1;
document.getElementById('pts').innerHTML=d.pts.map(p=>`<div class="pt"><i></i><span>${p}</span></div>`).join('');

</body></html>
