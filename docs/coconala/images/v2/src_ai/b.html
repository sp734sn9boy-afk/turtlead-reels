<!doctype html><html lang="ja"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&family=Yusei+Magic&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1220px;height:1240px;overflow:hidden;position:relative;font-family:"Zen Maru Gothic",sans-serif;color:#23322b;background:#1f7a5a}
.paper{position:absolute;left:34px;top:462px;right:34px;bottom:34px;background:#fffdf6;border-radius:22px;
background-image:linear-gradient(#dfe9e2 2px,transparent 2px);background-size:100% 52px;background-position:0 18px}
.tag{position:absolute;left:76px;top:126px;font-weight:900;font-size:36px;color:#1f7a5a;background:#fff;padding:4px 24px 8px;border-radius:999px}
.ok{position:absolute;right:72px;top:118px;font-weight:900;font-size:34px;color:#23322b;background:#ffd84a;padding:8px 24px 10px;transform:rotate(3deg);box-shadow:0 4px 0 rgba(0,0,0,.15)}
h1{position:absolute;left:72px;top:182px;color:#fff;font-weight:900;font-size:108px;line-height:1.1;letter-spacing:-.02em;white-space:nowrap}
h1 b{color:#ffd84a;font-size:150px;letter-spacing:-.04em;line-height:.9}
h1 small{font-size:96px}h1{}
.steps{position:absolute;left:72px;right:72px;top:490px;display:flex;flex-direction:column;gap:14px}
.st{height:160px;background:#fff;border:5px solid #23322b;border-radius:20px;display:flex;align-items:center;box-shadow:8px 8px 0 #1f7a5a;overflow:hidden}
.n{flex:none;width:132px;height:100%;background:#1f7a5a;color:#fff;font-weight:900;font-size:110px;display:flex;align-items:center;justify-content:center;line-height:1;padding-bottom:10px}
.t{padding-left:26px;flex:1;white-space:nowrap}
.t b{display:block;font-weight:900;font-size:50px;line-height:1.15;letter-spacing:-.02em}
.t span{display:block;font-weight:700;font-size:31px;color:#5b6b63;margin-top:6px}
.ev{flex:none;width:330px;height:128px;margin-right:18px;position:relative}
.win{position:absolute;inset:0;background:#f3f6fa;border:3px solid #23322b;border-radius:12px;padding:10px 12px;font-size:19px;font-weight:700;line-height:1.35;overflow:hidden}
.bub{background:#2b66d9;color:#fff;border-radius:14px 14px 3px 14px;padding:6px 12px;margin-left:36px}
.inp{margin-top:8px;background:#fff;border:2px solid #b9c3d2;border-radius:10px;padding:5px 10px;color:#8b95a5;font-size:18px;display:flex;justify-content:space-between}
.inp i{font-style:normal;background:#2b66d9;color:#fff;border-radius:6px;padding:0 10px}
.tabs{display:flex;gap:6px;margin-bottom:7px}.tabs u{text-decoration:none;font-size:18px;padding:2px 10px;border-radius:8px;background:#dbe2ec;color:#56606e}.tabs u.on{background:#23322b;color:#fff}
.res{background:#fff;border:2px solid #cfd7e3;border-radius:8px;padding:5px 10px;font-size:18px;line-height:1.38}
.memo{position:absolute;inset:0 6px;background:#fff3a8;transform:rotate(-2.5deg);padding:8px 16px;font-family:"Yusei Magic";font-size:23px;line-height:1.3;color:#3a3320;box-shadow:3px 4px 0 rgba(0,0,0,.18)}
.memo b{font-weight:400;color:#e8552e}
.memo:before{content:"";position:absolute;left:38%;top:-13px;width:90px;height:26px;background:rgba(31,122,90,.45);transform:rotate(3deg)}
.foot{position:absolute;left:72px;top:1016px;display:flex;align-items:center;gap:22px}
.price{background:#e8552e;color:#fff;border-radius:16px;padding:0 24px 6px;font-weight:900;white-space:nowrap}
.price small{font-size:36px}.price b{font-size:68px;letter-spacing:-.02em}.price i{font-style:normal;font-size:34px}
.trust{font-size:25px;font-weight:700;line-height:1.3;color:#44524b}
</style></head><body><div class="paper"></div>
<div class="tag">生成AI　1対1レッスン</div>
<div class="ok">パソコンが苦手でもOK</div>
<h1><b>60</b><small>分で、</small><br>ここまで一緒に。</h1>
<div class="steps">
 <div class="st"><div class="n">1</div><div class="t"><b>AIに話しかける</b><span>画面を見ながら、一緒に操作</span></div>
  <div class="ev"><div class="win"><div class="bub">お休みのお知らせを書いて</div><div class="inp">AIに頼みたいことを書く<i>送る</i></div></div></div></div>
 <div class="st"><div class="n">2</div><div class="t"><b>自分の仕事で試す</b><span>メール返信・求人文・SNS投稿</span></div>
  <div class="ev"><div class="win"><div class="tabs"><u>メール</u><u class="on">求人文</u><u>SNS</u></div><div class="res">未経験の方も歓迎。週3日から、あなたのペースで働けます。</div></div></div></div>
 <div class="st"><div class="n">3</div><div class="t"><b>頼み方メモを持ち帰る</b><span>次の日から、そのまま使える</span></div>
  <div class="ev"><div class="memo"><b>頼み方メモ</b><br>①だれに向けて？<br>②何を・どんな口調で？</div></div></div>
</div>
<div class="foot"><div class="price"><small>60分 </small><b>11,000</b><i>円</i></div>
<div class="trust">鹿児島で地域情報誌「マイタウンガイド」を<br>発行する会社が教えます</div></div>
</body></html>
