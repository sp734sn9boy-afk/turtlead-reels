<!doctype html><html lang="ja"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1220px;height:1240px;overflow:hidden;position:relative;font-family:"M PLUS Rounded 1c",sans-serif;background:#00b3a7;color:#12303a}
.tag{position:absolute;left:0;top:112px;width:100%;background:#12303a;color:#fff;font-weight:900;font-size:62px;text-align:center;padding:2px 0 10px;letter-spacing:.02em}
h1{position:absolute;left:0;width:100%;top:214px;text-align:center;font-weight:900;line-height:1.02;white-space:nowrap;color:#fff;-webkit-text-stroke:14px #12303a;paint-order:stroke fill}
h1 b{display:block;font-size:186px;letter-spacing:-.06em}
h1 span{display:block;font-size:216px;color:#ffe600;letter-spacing:-.03em}
.bub{position:absolute;font-weight:900;font-size:100px;white-space:nowrap;padding:8px 40px 20px;border:8px solid #12303a;letter-spacing:-.03em;box-shadow:8px 10px 0 #12303a}
.me{right:40px;top:650px;background:#fff;border-radius:60px 60px 8px 60px}
.ai{left:40px;top:836px;background:#ffe600;border-radius:8px 60px 60px 60px}
.ai u{text-decoration:none;display:inline-block;background:#12303a;color:#fff;font-size:60px;border-radius:50%;width:104px;height:104px;line-height:98px;text-align:center;vertical-align:middle;margin:0 16px 0 -14px}
.ph{position:absolute;right:-70px;top:900px;width:470px;height:470px;border-radius:50%;border:10px solid #fff;background:url(photos/pexels-461077.jpg) 72% 46%/1150px auto;z-index:-0}
.price{position:absolute;left:40px;top:1030px;background:#e60012;color:#fff;font-weight:900;border-radius:18px;padding:0 26px 8px;white-space:nowrap}
.price small{font-size:58px;color:#ffe600}.price b{font-size:104px;letter-spacing:-.02em}.price i{font-style:normal;font-size:54px}
.me,.ai,.price{z-index:2}
.trust{position:absolute;left:0;top:1160px;font-size:1px}
</style></head><body>
<div class="tag">AIの使い方、1対1で教えます</div>
<h1><b>パソコン苦手</b><span>でもOK！</span></h1>
<div class="ph"></div>
<div class="bub me">求人文を書いて</div>
<div class="bub ai"><u>AI</u>はい、できました！</div>
<div class="price"><small>60分 </small><b>11,000</b><i>円</i></div>
</body></html>
