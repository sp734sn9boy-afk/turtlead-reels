<style>

 <div class="lab">あなた</div><div class="me">求人の文章を書いて</div>

 <div class="say">どこにでもある文…</div></div>

 <div class="lab">あなた</div><div class="me">美容室の求人。<b>未経験OK</b>・<b>週3日〜</b><br><b>やさしい口調</b>で書いて</div>
 <div class="lab">AI</div><div class="ai">はじめての方も大歓迎です。先輩がとなりで教えます。週3日から働けます。</div><div class="say">そのまま使える文に！</div></div>

<div class="trust">鹿児島で地域情報誌「マイタウンガイド」を発行する会社が教えます</div>
