<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>美容室 ソラニワ（デザイン例・架空のお店）</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:"Zen Maru Gothic",sans-serif;color:#4a4039;background:#fffdf9}
header{display:flex;align-items:center;justify-content:space-between;padding:24px 56px}
.logo{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:36px;color:#b0806a;line-height:1}.logo small{display:block;font-family:"Zen Maru Gothic";font-style:normal;font-size:11px;letter-spacing:.3em;color:#8d8178;margin-top:4px}
nav{display:flex;gap:34px;font-size:15px;font-weight:500;align-items:center}nav b{background:#d9a48f;color:#fff;padding:12px 28px;border-radius:999px}
.hero{position:relative;height:640px;padding:0 56px}
.p1{position:absolute;right:56px;top:0;width:54%;height:560px;border-radius:280px 280px 16px 16px;background:url(assets/bi_tennai.jpg) center/cover}
.p2{position:absolute;right:calc(54% - 30px);bottom:20px;width:230px;height:290px;border-radius:16px;border:8px solid #fffdf9;background:url(assets/bi_hair.jpg) center 30%/cover}
.t{position:absolute;left:72px;top:110px}.t em{font-family:"Cormorant Garamond",serif;font-size:30px;color:#b0806a}
.t h1{font-size:54px;line-height:1.5;font-weight:700;margin:10px 0 18px;letter-spacing:.04em}.t p{font-size:16px;line-height:2}
.t span{display:inline-block;margin-top:26px;background:#d9a48f;color:#fff;font-weight:700;padding:17px 46px;border-radius:999px;font-size:17px}
.sec{padding:50px 72px;background:#f8efe8}.sec h2{text-align:center;font-size:30px}.sec h2 small{display:block;font-family:"Cormorant Garamond",serif;font-style:italic;font-size:22px;color:#b0806a}
.menu{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin-top:30px}.menu div{background:#fff;border-radius:14px;padding:24px;text-align:center}.menu h3{font-size:18px}.menu p{font-size:22px;color:#b0806a;font-weight:700;margin-top:6px}
footer{text-align:center;padding:34px;font-size:13px;color:#8d8178}.mb{display:none}
@media(max-width:700px){header{padding:14px 18px}.logo{font-size:28px}.logo small{font-size:9px}nav{display:none}
.mb{display:block;width:26px;height:18px;border-top:2.5px solid #b0806a;border-bottom:2.5px solid #b0806a;position:relative}.mb:after{content:"";position:absolute;left:0;right:0;top:5px;border-top:2.5px solid #b0806a}
.hero{height:auto;padding:0 18px 30px}.p1{position:static;width:100%;height:330px;border-radius:170px 170px 14px 14px}.p2{right:26px;left:auto;bottom:auto;top:230px;width:110px;height:140px;border-width:5px}
.t{position:static;margin-top:22px}.t em{font-size:22px}.t h1{font-size:30px;margin:4px 0 10px}.t p{font-size:14px;line-height:1.9}.t span{display:block;text-align:center;margin-top:18px;padding:15px}
.sec{padding:30px 18px}.menu{grid-template-columns:1fr 1fr;gap:12px}.menu div{padding:16px}}
</style></head><body>
<header><div class="logo">Soraniwa<small>美容室 ソラニワ</small></div><nav><span>コンセプト</span><span>メニュー</span><span>スタイル</span><span>アクセス</span><b>ご予約</b></nav><div class="mb"></div></header>
<section class="hero"><div class="p1"></div><div class="p2"></div><div class="t"><em>Natural light.</em><h1>髪とすごす、<br>やさしい時間。</h1><p>光の入る小さな美容室です。<br>お一人ずつ、ゆっくりご案内します。</p><span>空き状況を見る・予約する</span></div></section>
<section class="sec"><h2><small>Menu</small>メニュー</h2><div class="menu"><div><h3>カット</h3><p>4,400円</p></div><div><h3>カラー</h3><p>6,600円〜</p></div><div><h3>パーマ</h3><p>7,700円〜</p></div><div><h3>トリートメント</h3><p>3,300円</p></div></div></section>
<footer>美容室 ソラニワ ｜ デザイン例（架空のお店です）</footer></body></html>
