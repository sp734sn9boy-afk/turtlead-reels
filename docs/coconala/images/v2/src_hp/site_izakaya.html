<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>炭火焼き 灯（デザイン例・架空のお店）</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:"Noto Sans JP",sans-serif;color:#f3ead9;background:#1d1611}
header{position:absolute;left:0;right:0;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:26px 56px}
.logo{font-family:"Shippori Mincho",serif;font-weight:800;font-size:30px;letter-spacing:.12em;display:flex;align-items:center;gap:14px}
.logo i{display:block;width:44px;height:44px;border-radius:8px;background:#c8442b;color:#fff;font-style:normal;font-size:26px;text-align:center;line-height:42px}
nav{display:flex;gap:36px;font-size:15px;font-weight:500;align-items:center}nav b{border:1.5px solid #f3ead9;padding:11px 26px;border-radius:4px}
.hero{height:680px;position:relative;display:grid;grid-template-columns:1fr 1fr 1fr}
.hero>div{background-size:cover;background-position:center}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,12,6,.7),rgba(20,12,6,.25) 40%,rgba(20,12,6,.75));z-index:1}
.copy{position:absolute;z-index:2;left:0;right:0;top:210px;text-align:center}
.copy h1{font-family:"Shippori Mincho",serif;font-size:74px;font-weight:800;letter-spacing:.14em;text-shadow:0 2px 20px rgba(0,0,0,.6)}
.copy p{font-size:19px;letter-spacing:.2em;margin-top:18px}
.copy span{display:inline-block;margin-top:36px;background:#c8442b;color:#fff;padding:18px 54px;font-weight:700;font-size:18px;border-radius:4px;letter-spacing:.1em}
.info{position:absolute;z-index:2;left:0;right:0;bottom:26px;display:flex;justify-content:center;gap:44px;font-size:15px}
.sec{padding:60px 72px;background:#f6efe2;color:#2b2119}.sec h2{font-family:"Shippori Mincho",serif;font-size:36px;text-align:center;letter-spacing:.2em}
.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:30px;margin-top:36px}.menu div div{height:240px;background-size:cover;background-position:center;border-radius:6px}
.menu h3{font-family:"Shippori Mincho",serif;font-size:22px;margin-top:14px;display:flex;justify-content:space-between}.menu p{font-size:14px;color:#76685a;margin-top:4px}
footer{background:#120d09;color:#a89a86;text-align:center;padding:36px;font-size:13px}.mb{display:none}
@media(max-width:700px){header{padding:14px 18px}.logo{font-size:21px}.logo i{width:34px;height:34px;font-size:20px;line-height:32px}nav{display:none}
.mb{display:block;width:26px;height:18px;border-top:3px solid #f3ead9;border-bottom:3px solid #f3ead9;position:relative}.mb:after{content:"";position:absolute;left:0;right:0;top:4.5px;border-top:3px solid #f3ead9}
.hero{height:560px;grid-template-columns:1fr}.hero>div:nth-child(n+2){display:none}.copy{top:170px}.copy h1{font-size:40px}.copy p{font-size:13px}.copy span{padding:15px 36px;font-size:15px;margin-top:26px}
.info{flex-direction:column;gap:4px;text-align:center;font-size:12px;bottom:18px}.sec{padding:34px 20px}.sec h2{font-size:26px}.menu{grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}.menu div div{height:130px}.menu h3{font-size:15px}.menu p{font-size:11px}}
</style></head><body>
<header><div class="logo"><i>灯</i>炭火焼き 灯</div><nav><span>こだわり</span><span>お品書き</span><span>店内・座敷</span><span>アクセス</span><b>ご予約</b></nav><div class="mb"></div></header>
<section class="hero"><div style="background-image:url(assets/iz_yakitori.jpg)"></div><div style="background-image:url(assets/iz_sashimi.jpg)"></div><div style="background-image:url(assets/iz_gaikan.jpg)"></div>
<div class="copy" style="background:none"><h1>炭火で、一本ずつ。</h1><p>地鶏の炭火焼きと、季節の肴</p><span>ご予約・空席の確認</span></div>
<div class="info" style="background:none"><span>営業 17:00〜23:00</span><span>定休 火曜</span><span>カウンター8席・座敷あり</span></div></section>
<section class="sec"><h2>お品書き</h2><div class="menu">
<div><div style="background-image:url(assets/iz_yakitori.jpg)"></div><h3>地鶏の炭火焼き <span>580円</span></h3><p>備長炭でじっくり。塩・たれ</p></div>
<div><div style="background-image:url(assets/iz_sashimi.jpg)"></div><h3>季節の刺身盛り <span>1,280円</span></h3><p>その日の朝に仕入れた魚を</p></div>
<div><div style="background-image:url(assets/iz_karaage.jpg)"></div><h3>揚げたて唐揚げ <span>680円</span></h3><p>注文を受けてから揚げます</p></div></div></section>
<footer>炭火焼き 灯 ｜ デザイン例（架空のお店です）</footer></body></html>
