<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>note見出し ふるさと納税 20261117</title>
<!--
  ===== 文言の差し替えはここだけ =====
  下の <body> 内の「HEADLINE」「SUB」「TAG」の3か所を書き換える。
  見出しは 2行まで（<br> で改行）・1行8〜10文字が目安。
  サイズ: 1280x670 px（note推奨）。フォント: IPAゴシック（システム内蔵）。
  外部画像なし。図形はすべて CSS/SVG で描画（素材の出どころ：自作）。
-->
<style>
  :root{
    --bg1:#0f2747; --bg2:#173a66;
    --accent:#ffcc33; --accent2:#3ec7b5; --accent3:#ff7a6b;
    --ink:#ffffff; --muted:#b9c9e0;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1280px;height:670px;overflow:hidden}
  body{
    background:radial-gradient(circle at 85% 20%, #22508a 0%, transparent 55%),
               linear-gradient(135deg,var(--bg1),var(--bg2));
    font-family:"IPAPGothic","IPAGothic","WenQuanYi Zen Hei",sans-serif;
    color:var(--ink); position:relative;
  }
  .text{position:absolute;left:80px;top:0;bottom:0;width:640px;display:flex;flex-direction:column;justify-content:center}
  .tag{display:inline-block;align-self:flex-start;background:var(--accent);color:#13284a;
       font-weight:700;font-size:30px;padding:8px 22px;border-radius:999px;margin-bottom:34px;letter-spacing:.04em}
  .headline{font-size:92px;font-weight:700;line-height:1.22;letter-spacing:.01em;
            text-shadow:0 4px 0 rgba(0,0,0,.18)}
  .headline em{font-style:normal;color:var(--accent)}
  .sub{margin-top:36px;font-size:40px;font-weight:700;color:var(--muted);letter-spacing:.04em}
  .art{position:absolute;right:70px;top:95px;width:440px;height:480px}
  .brand{position:absolute;right:34px;bottom:22px;font-family:"DejaVu Sans",sans-serif;
         font-size:20px;color:rgba(255,255,255,.55);letter-spacing:.12em}
</style>
</head>
<body>
  <div class="text">
    <div class="tag">2026年内に間に合う</div>
    <div class="headline">ふるさと納税、<br><em>迷わず終える。</em></div>
    <div class="sub">上限額シート × 申請方法の判断表</div>
  </div>

  <!-- イラスト（自作SVG：計算シート＋チェック表＋12/31カレンダー）。素材の出どころ：自作 -->
  <svg class="art" viewBox="0 0 440 480" xmlns="http://www.w3.org/2000/svg">
    <!-- calc sheet (back) -->
    <g transform="rotate(-6 200 230)">
      <rect x="40" y="40" width="300" height="370" rx="26" fill="#e7edf5"/>
    </g>
    <!-- main sheet -->
    <rect x="30" y="30" width="320" height="390" rx="28" fill="#ffffff"/>
    <rect x="30" y="30" width="320" height="76" rx="28" fill="#3ec7b5"/>
    <rect x="30" y="80" width="320" height="26" fill="#3ec7b5"/>
    <!-- calc rows: label bar + value bar -->
    <rect x="62" y="56" width="140" height="22" rx="11" fill="#ffffff" opacity=".9"/>
    <g fill="#c9d5e6">
      <rect x="62" y="136" width="110" height="18" rx="9"/>
      <rect x="62" y="182" width="90" height="18" rx="9"/>
      <rect x="62" y="228" width="120" height="18" rx="9"/>
    </g>
    <g fill="#13284a">
      <rect x="226" y="132" width="92" height="26" rx="8"/>
      <rect x="226" y="178" width="92" height="26" rx="8"/>
      <rect x="226" y="224" width="92" height="26" rx="8"/>
    </g>
    <line x1="62" y1="274" x2="318" y2="274" stroke="#13284a" stroke-width="5" stroke-linecap="round"/>
    <rect x="62" y="292" width="70" height="20" rx="10" fill="#c9d5e6"/>
    <rect x="196" y="286" width="122" height="34" rx="10" fill="#ffcc33"/>
    <!-- checklist -->
    <g stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="62" y="344" width="30" height="30" rx="7" stroke="#3ec7b5" stroke-width="5"/>
      <path d="M68 359 l8 8 l14 -16" stroke="#3ec7b5" stroke-width="6"/>
      <rect x="62" y="384" width="30" height="0" stroke="none"/>
    </g>
    <rect x="108" y="350" width="130" height="18" rx="9" fill="#c9d5e6"/>

    <!-- calendar with deadline -->
    <g transform="translate(250 270)">
      <rect x="0" y="16" width="170" height="170" rx="24" fill="#ffffff" stroke="#0f2747" stroke-width="7"/>
      <rect x="3" y="19" width="164" height="48" rx="20" fill="#ff7a6b"/>
      <rect x="3" y="48" width="164" height="19" fill="#ff7a6b"/>
      <rect x="38" y="0" width="16" height="40" rx="8" fill="#0f2747"/>
      <rect x="116" y="0" width="16" height="40" rx="8" fill="#0f2747"/>
      <text x="85" y="138" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="40" fill="#13284a">12/31</text>
      <ellipse cx="85" cy="124" rx="66" ry="34" fill="none" stroke="#ff7a6b" stroke-width="7" transform="rotate(-6 85 124)"/>
    </g>
  </svg>
</body>
</html>
