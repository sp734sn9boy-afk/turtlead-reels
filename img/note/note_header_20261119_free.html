<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>note見出し 見せ方と場所 20261119</title>
<!--
  note無料記事「広告の反応がないのは、中身より『見せ方と場所』かもしれない」用の見出し画像。
  サイズ: 1280x670 px（note推奨）。フォント: IPAゴシック（システム内蔵）。
  方針: 生成りの地 × 紺の文字 × 差し色1色（朱）。キラキラさせない。主文は中央寄せ。
  外部画像・写真・人物・他社ロゴなし。装飾はCSSのみ（素材の出どころ：自作）。
-->
<style>
  :root{
    --bg:#f8f4ea;      /* 生成り */
    --ink:#13284a;     /* 紺 */
    --muted:#4a5a74;   /* 紺の淡色（小さい文字） */
    --accent:#d9573b;  /* 差し色：朱 */
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1280px;height:670px;overflow:hidden}
  body{
    background:var(--bg);
    font-family:"IPAPGothic","IPAGothic","WenQuanYi Zen Hei",sans-serif;
    color:var(--ink); position:relative;
  }
  /* 細い紺の内枠 */
  .frame{position:absolute;inset:28px;border:3px solid var(--ink);opacity:.9}
  .wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .lead{font-size:32px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin-bottom:40px}
  .lead::before,.lead::after{content:"";display:inline-block;width:46px;height:3px;background:var(--accent);vertical-align:middle;margin:0 18px 6px}
  .main{font-weight:700;line-height:1.32;letter-spacing:.02em}
  .l1{font-size:74px}
  .l2{font-size:80px}
  .mark{background:linear-gradient(transparent 72%, rgba(217,87,59,.85) 72%, rgba(217,87,59,.85) 90%, transparent 90%)}
  .brand{position:absolute;left:0;right:0;bottom:56px;text-align:center;font-family:"DejaVu Sans",sans-serif;
         font-size:24px;font-weight:700;color:var(--ink);letter-spacing:.2em}
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="wrap">
    <div class="lead">広告づくり15年・約1,800本で分かったこと</div>
    <div class="main">
      <div class="l1">いい商品でも、</div>
      <div class="l2"><span class="mark">見てもらえなければ</span>売れない。</div>
    </div>
  </div>
  <div class="brand">turtle ad</div>
</body>
</html>
