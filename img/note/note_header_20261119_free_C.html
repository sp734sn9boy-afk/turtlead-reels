<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>note見出し 案C 20261119</title>
<!--
  note無料記事「広告の反応がないのは、中身より『見せ方と場所』かもしれない」見出し画像 案C。
  サイズ: 1280x670 px。フォント: IPAゴシック（システム内蔵）。
  方針: 暗い売り場にスポットライト。光の中の1つだけが見え、暗がりの商品は見えない＝「見てもらえない」。
  濃紺〜黒の地 × 白文字 × 差し色1色（光の暖色）。図形はCSSのみで自作。写真・人物・他社ロゴなし（素材の出どころ：自作）。
-->
<style>
  :root{ --bg:#070d1a; --ink:#ffffff; --light:#ffe2a3; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1280px;height:670px;overflow:hidden}
  body{background:var(--bg);font-family:"IPAPGothic","IPAGothic",sans-serif;color:var(--ink);position:relative}
  /* 光の帯（上から下へ広がる） */
  .beam{position:absolute;left:0;top:0;width:1280px;height:670px;
        clip-path:polygon(560px 0,720px 0,920px 670px,360px 670px);
        background:linear-gradient(180deg,rgba(255,226,163,.30),rgba(255,226,163,.10) 85%,rgba(255,226,163,0))}
  /* 床の光だまり */
  .pool{position:absolute;left:380px;top:560px;width:520px;height:90px;border-radius:50%;
        background:radial-gradient(ellipse at center,rgba(255,226,163,.55),rgba(255,226,163,0) 70%)}
  /* 商品の箱 */
  .box{position:absolute;width:96px;height:110px;border-radius:8px}
  .box::before{content:"";position:absolute;left:14px;right:14px;top:22px;height:20px;border-radius:4px;background:rgba(0,0,0,.25)}
  .lit{left:592px;top:490px;background:var(--light);box-shadow:0 0 60px rgba(255,226,163,.55)}
  .dark{top:490px;background:#18233a}
  .d1{left:110px}.d2{left:240px}.d3{left:944px}.d4{left:1074px}
  .wrap{position:absolute;left:0;right:0;top:96px;text-align:center;font-weight:700}
  .l1{font-size:92px;-webkit-text-stroke:2px currentColor;letter-spacing:.02em}
  .l2{font-size:120px;color:var(--light);-webkit-text-stroke:3px currentColor;margin-top:4px;letter-spacing:.02em}
  .brand{position:absolute;right:48px;bottom:30px;font-family:"DejaVu Sans",sans-serif;font-size:22px;font-weight:700;color:#7d8aa3;letter-spacing:.2em}
</style>
</head>
<body>
  <div class="beam"></div>
  <div class="pool"></div>
  <div class="box dark d1"></div><div class="box dark d2"></div>
  <div class="box lit"></div>
  <div class="box dark d3"></div><div class="box dark d4"></div>
  <div class="wrap">
    <div class="l1">見えない商品は、</div>
    <div class="l2">選ばれない。</div>
  </div>
  <div class="brand">turtle ad</div>
</body>
</html>
