<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>note見出し画像テンプレ</title>
<!--
  ===== 文言の差し替えはここだけ =====
  下の <body> 内の「HEADLINE」「SUB」「TAG」の3か所を書き換える。
  見出しは 2行まで（<br> で改行）・1行8〜10文字が目安。
  サイズ: 1280x670 px（note推奨）。フォント: IPAゴシック（システム内蔵）。
  外部画像なし。図形はすべて CSS/SVG で描画（素材の出どころ：自作）。
-->
<style>
  :root{
    --bg1:#0f2747; --bg2:#173a66;
    --accent:#ffcc33; --accent2:#3ec7b5; --accent3:#ff7a6b;
    --ink:#ffffff; --muted:#b9c9e0;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1280px;height:670px;overflow:hidden}
  body{
    background:radial-gradient(circle at 85% 20%, #22508a 0%, transparent 55%),
               linear-gradient(135deg,var(--bg1),var(--bg2));
    font-family:"IPAPGothic","IPAGothic","WenQuanYi Zen Hei",sans-serif;
    color:var(--ink); position:relative;
  }
  .text{position:absolute;left:80px;top:0;bottom:0;width:640px;display:flex;flex-direction:column;justify-content:center}
  .tag{display:inline-block;align-self:flex-start;background:var(--accent);color:#13284a;
       font-weight:700;font-size:30px;padding:8px 22px;border-radius:999px;margin-bottom:34px;letter-spacing:.04em}
  .headline{font-size:92px;font-weight:700;line-height:1.22;letter-spacing:.01em;
            text-shadow:0 4px 0 rgba(0,0,0,.18)}
  .headline em{font-style:normal;color:var(--accent)}
  .sub{margin-top:36px;font-size:40px;font-weight:700;color:var(--muted);letter-spacing:.04em}
  .art{position:absolute;right:70px;top:95px;width:440px;height:480px}
  .brand{position:absolute;right:34px;bottom:22px;font-family:"DejaVu Sans",sans-serif;
         font-size:20px;color:rgba(255,255,255,.55);letter-spacing:.12em}
</style>
</head>
<body>
  <div class="text">
    <!-- TAG：小さなラベル（不要なら行ごと削除） -->
    <div class="tag">月額を抑えるコツ</div>
    <!-- HEADLINE：大きな見出し。<em>で囲むと黄色強調 -->
    <div class="headline">VODの月額、<br><em>もう重ねない。</em></div>
    <!-- SUB：小見出し -->
    <div class="sub">契約ローテ × 視聴管理テンプレ</div>
  </div>

  <!-- イラスト（自作SVG：カレンダー＋再生ボタン＋矢印）。記事ごとに差し替え可 -->
  <svg class="art" viewBox="0 0 440 480" xmlns="http://www.w3.org/2000/svg">
    <!-- calendar card -->
    <rect x="20" y="40" width="400" height="400" rx="34" fill="#ffffff"/>
    <rect x="20" y="40" width="400" height="90" rx="34" fill="#ff7a6b"/>
    <rect x="20" y="96" width="400" height="34" fill="#ff7a6b"/>
    <rect x="95" y="14" width="22" height="62" rx="11" fill="#13284a"/>
    <rect x="323" y="14" width="22" height="62" rx="11" fill="#13284a"/>
    <!-- 3 month slots, rotating -->
    <g>
      <rect x="50" y="160" width="100" height="100" rx="18" fill="#3ec7b5"/>
      <rect x="170" y="160" width="100" height="100" rx="18" fill="#e7edf5"/>
      <rect x="290" y="160" width="100" height="100" rx="18" fill="#e7edf5"/>
      <rect x="50" y="280" width="100" height="100" rx="18" fill="#e7edf5"/>
      <rect x="170" y="280" width="100" height="100" rx="18" fill="#ffcc33"/>
      <rect x="290" y="280" width="100" height="100" rx="18" fill="#e7edf5"/>
      <!-- play icons in active slots -->
      <path d="M88 190 L122 210 L88 230 Z" fill="#fff"/>
      <path d="M208 310 L242 330 L208 350 Z" fill="#13284a"/>
      <!-- check marks -->
      <path d="M310 330 l16 16 l34 -34" stroke="#3ec7b5" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M68 330 l16 16 l34 -34" stroke="#b9c9e0" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- rotate arrow -->
    <g transform="translate(330 400)">
      <circle r="62" fill="#ffcc33" stroke="#0f2747" stroke-width="8"/>
      <path d="M-28 6 A30 30 0 1 1 6 28" stroke="#0f2747" stroke-width="11" fill="none" stroke-linecap="round"/>
      <path d="M-44 -6 L-28 14 L-10 -4 Z" fill="#0f2747"/>
    </g>
  </svg>

  <div class="brand">turtle ad</div>
</body>
</html>
