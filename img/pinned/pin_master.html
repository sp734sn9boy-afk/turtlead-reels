<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800&text=turtle%20ad&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:3128px;height:1350px;background:#04070f}
.m{position:relative;width:3128px;height:1350px;overflow:hidden;font-family:'Noto Sans JP',sans-serif;color:#f2f6ff;
 background:
  radial-gradient(800px 640px at 1564px 760px, rgba(79,227,255,.20), transparent 70%),
  radial-gradient(700px 560px at 2650px 420px, rgba(139,107,255,.28), transparent 70%),
  radial-gradient(700px 600px at 420px 1000px, rgba(40,110,190,.22), transparent 70%),
  linear-gradient(180deg,#0b1a36 0%,#081024 55%,#04070f 100%);}
.vig{position:absolute;inset:0;background:radial-gradient(1900px 900px at 1564px 700px, transparent 55%, rgba(2,4,10,.65) 100%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(79,227,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(79,227,255,.04) 1px,transparent 1px);background-size:54px 54px}
svg.layer{position:absolute;left:0;top:0;width:3128px;height:1350px}
.ab{position:absolute}
/* top row */
.logo{left:110px;top:140px;display:flex;align-items:center;gap:14px}
.logo svg{width:58px;height:58px;filter:drop-shadow(0 0 10px rgba(60,214,240,.5))}
.logo span{font-family:'M PLUS Rounded 1c',sans-serif;font-weight:800;font-size:40px}
.logo em{font-style:normal;color:#3CD6F0}
.tagr{right:108px;top:156px;font-family:'Outfit',sans-serif;font-weight:500;font-size:24px;letter-spacing:.3em;color:#a9c0ff}
/* browser */
.br{left:700px;top:470px;width:1730px;height:620px;border-radius:20px;background:rgba(14,28,60,.78);border:2px solid rgba(79,227,255,.5);box-shadow:0 40px 120px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.25);overflow:hidden}
.br .bar{height:50px;border-bottom:1px solid rgba(169,182,216,.16);position:relative}
.br .dots{position:absolute;left:24px;top:19px;display:flex;gap:10px}
.br .dots i{width:12px;height:12px;border-radius:50%;background:rgba(169,182,216,.3)}
.br .url{position:absolute;left:614px;top:11px;width:502px;height:28px;border-radius:14px;background:rgba(169,182,216,.10);font-family:'Outfit',sans-serif;font-size:18px;letter-spacing:.06em;color:#a9b6d8;text-align:center;line-height:28px}
.br .nav{position:absolute;left:450px;top:96px;width:830px;display:flex;justify-content:space-between;align-items:center}
.br .nav .lg{width:120px;height:14px;border-radius:7px;background:linear-gradient(90deg,#c9d4f0,#3CD6F0)}
.br .nav .mn{display:flex;gap:22px}.br .nav .mn i{display:block;width:62px;height:10px;border-radius:5px;background:rgba(169,182,216,.3)}
.br .eyebrow{position:absolute;left:450px;top:172px;width:830px;text-align:center;font-family:'Outfit',sans-serif;font-weight:500;font-size:20px;letter-spacing:.32em;color:#4fe3ff}
.br .ttl{position:absolute;left:450px;top:190px;width:830px;text-align:center;font-weight:900;font-size:66px;line-height:1.22;letter-spacing:.01em}
.br .ttl span{background:linear-gradient(90deg,#c9d4f0,#3CD6F0 55%,#8b6bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.br .lead{position:absolute;left:615px;top:396px;width:500px}
.br .lead i{display:block;height:10px;border-radius:5px;background:rgba(169,182,216,.28);margin:0 auto 10px}
.br .cta{position:absolute;left:765px;top:452px;width:200px;height:46px;border-radius:23px;background:linear-gradient(90deg,#4fe3ff,#8b6bff);box-shadow:0 0 30px rgba(79,227,255,.35)}
.br .cards{position:absolute;left:470px;top:530px;display:flex;gap:20px}
.br .cards i{display:block;width:250px;height:120px;border-radius:12px;border:1px solid rgba(79,227,255,.25);background:linear-gradient(160deg,rgba(79,227,255,.10),rgba(139,107,255,.08))}
/* chat */
.chat{left:150px;top:600px;width:750px;height:450px;border-radius:22px;background:rgba(16,30,64,.9);border:1.5px solid rgba(79,227,255,.6);box-shadow:0 0 60px rgba(79,227,255,.25), 0 30px 80px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.2);padding:28px 34px}
.chat .hd{display:flex;align-items:center;gap:12px;font-family:'Outfit',sans-serif;font-weight:700;font-size:20px;letter-spacing:.24em;color:#a9c0ff}
.chat .hd i{width:12px;height:12px;border-radius:50%;background:#4fe3ff;box-shadow:0 0 12px #4fe3ff}
.chat .u{margin:34px 0 0 auto;width:fit-content;max-width:520px;padding:18px 26px;border-radius:22px 22px 6px 22px;background:linear-gradient(90deg,rgba(79,227,255,.22),rgba(139,107,255,.22));border:1px solid rgba(79,227,255,.35);font-size:28px;font-weight:700}
.chat .a{margin-top:26px;width:560px;padding:22px 26px;border-radius:22px 22px 22px 6px;background:rgba(10,20,46,.9);border:1px solid rgba(169,182,216,.18)}
.chat .a .who{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.chat .a .who b{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#4fe3ff,#8b6bff)}
.chat .a .who span{font-family:'Outfit',sans-serif;font-size:18px;letter-spacing:.2em;color:#a9b6d8}
.chat .a i{display:block;height:12px;border-radius:6px;margin-bottom:12px;background:linear-gradient(90deg,rgba(79,227,255,.75),rgba(139,107,255,.5));box-shadow:0 0 14px rgba(79,227,255,.35)}
/* phone */
.ph{left:2350px;top:430px;width:360px;height:680px;border-radius:52px;padding:3px;background:linear-gradient(160deg,#4fe3ff,#8b6bff);box-shadow:0 0 70px rgba(139,107,255,.35), 0 40px 100px rgba(0,0,0,.6)}
.ph .in{position:relative;width:100%;height:100%;border-radius:49px;overflow:hidden;background:
  radial-gradient(260px 240px at 70% 28%, rgba(139,107,255,.85), transparent 70%),
  radial-gradient(280px 260px at 25% 62%, rgba(40,130,220,.75), transparent 70%),
  linear-gradient(180deg,#141a4a,#081024)}
.ph .notch{position:absolute;left:130px;top:16px;width:94px;height:26px;border-radius:13px;background:#04070f}
.ph .reel{position:absolute;left:28px;top:62px;font-family:'Outfit',sans-serif;font-weight:700;font-size:18px;letter-spacing:.26em;color:#fff;opacity:.9}
.ph .play{position:absolute;left:127px;top:250px;width:106px;height:106px;border-radius:50%;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.7);backdrop-filter:blur(4px)}
.ph .play:after{content:'';position:absolute;left:42px;top:31px;border-left:34px solid #fff;border-top:21px solid transparent;border-bottom:21px solid transparent}
.ph .cap{position:absolute;left:50%;transform:translateX(-50%);top:478px;white-space:nowrap;padding:10px 22px;border-radius:10px;background:rgba(4,7,15,.72);font-size:32px;font-weight:900}
.ph .prog{position:absolute;left:28px;right:28px;top:600px;height:6px;border-radius:3px;background:rgba(255,255,255,.25)}
.ph .prog:before{content:'';position:absolute;left:0;top:0;bottom:0;width:58%;border-radius:3px;background:linear-gradient(90deg,#4fe3ff,#8b6bff)}
.ph .side{position:absolute;right:20px;top:330px;display:flex;flex-direction:column;gap:22px}
.ph .side i{display:block;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.22)}
/* bottom */
.svc{top:1112px}
.svc .no{font-family:'Outfit',sans-serif;font-weight:500;font-size:20px;letter-spacing:.3em;color:#4fe3ff}
.svc .nm{margin-top:6px;font-size:42px;font-weight:900;line-height:1.15}
.svc .ds{margin-top:6px;font-size:25px;font-weight:500;color:#a9b6d8}
.svc .ds b{color:#f2f6ff;font-weight:700}
</style></head><body><div class="m">
<div class="grid"></div>

<!-- back svg: big hexagon, top connector, light flow -->
<svg class="layer" viewBox="0 0 3128 1350">
 <defs>
  <linearGradient id="flow" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="3128" y2="0">
   <stop offset="0" stop-color="#3CD6F0" stop-opacity=".2"/><stop offset=".15" stop-color="#4fe3ff"/><stop offset=".55" stop-color="#4fe3ff"/><stop offset=".85" stop-color="#8b6bff"/><stop offset="1" stop-color="#8b6bff" stop-opacity=".2"/>
  </linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
 </defs>
 <g fill="none" stroke="#4fe3ff">
  <polygon points="1564,20 2222,400 2222,1160 1564,1540 906,1160 906,400" stroke-width="2" stroke-opacity=".13"/>
  <polygon points="1564,400 1893,590 1893,970 1564,1160 1235,970 1235,590" stroke-width="2" stroke-opacity=".08"/>
  <path d="M1564 20 L1564 400 M2222 400 L1893 590 M2222 1160 L1893 970 M906 1160 L1235 970 M906 400 L1235 590" stroke-width="1.5" stroke-opacity=".08"/>
  <path d="M906 400 L300 520 M2222 400 L2850 470" stroke-width="1" stroke-opacity=".2"/>
  <line x1="560" y1="175" x2="2620" y2="175" stroke-width="1" stroke-opacity=".3"/>
 </g>
 <g fill="#4fe3ff"><circle cx="1564" cy="20" r="5" fill-opacity=".6"/><circle cx="2222" cy="400" r="5" fill-opacity=".6"/><circle cx="906" cy="400" r="5" fill-opacity=".6"/><circle cx="300" cy="520" r="4" fill-opacity=".5"/><circle cx="2850" cy="470" r="4" fill-opacity=".5"/><circle cx="1564" cy="175" r="5"/><circle cx="1564" cy="175" r="14" fill-opacity=".18"/></g>
 <path d="M-20,905 C420,980 700,1062 900,1056 S1300,1110 1564,1110 S2080,1046 2330,1004 S2860,892 3148,876" fill="none" stroke="url(#flow)" stroke-width="40" stroke-opacity=".32" filter="url(#blur)"/>
 <path d="M-20,905 C420,980 700,1062 900,1056 S1300,1110 1564,1110 S2080,1046 2330,1004 S2860,892 3148,876" fill="none" stroke="url(#flow)" stroke-width="3" stroke-opacity=".95"/>
 <g fill="#ffffff"><circle cx="520" cy="1000" r="3.5" fill-opacity=".9"/><circle cx="1240" cy="1095" r="3" fill-opacity=".8"/><circle cx="1880" cy="1088" r="3.5" fill-opacity=".9"/><circle cx="2600" cy="950" r="3" fill-opacity=".8"/></g>
</svg>

<div class="vig"></div>
<!-- browser (center, crosses both seams) -->
<div class="ab br">
 <div class="bar"><div class="dots"><i></i><i></i><i></i></div><div class="url">turtle-ad.com</div></div>
 <div class="nav"><div class="lg"></div><div class="mn"><i></i><i></i><i></i><i></i></div></div>
 <div class="ttl"><span>ひと目で伝わる、</span><br>ホームページ。</div>
 <div class="lead"><i style="width:460px"></i><i style="width:360px"></i></div>
 <div class="cta"></div>
 <div class="cards"><i></i><i></i><i></i></div>
</div>

<!-- chat (left, front) -->
<div class="ab chat">
 <div class="hd"><i></i>AI ASSISTANT</div>
 <div class="u">新メニューの紹介文、考えて</div>
 <div class="a"><div class="who"><b></b><span>AI</span></div><i style="width:480px"></i><i style="width:500px"></i><i style="width:330px;margin-bottom:0"></i></div>
</div>

<!-- phone (right, front) -->
<div class="ab ph"><div class="in">
 <div class="notch"></div><div class="reel">REEL</div>
 <div class="play"></div>
 <div class="side"><i></i><i></i><i></i></div>
 <div class="cap">写真を送るだけ。</div>
 <div class="prog"></div>
</div></div>

<!-- top row -->
<div class="ab logo"><svg viewBox="0 0 100 100"><polygon points="50,6 88.1,28 88.1,72 50,94 11.9,72 11.9,28" fill="#0D3A34" stroke="#3CD6F0" stroke-width="3" stroke-linejoin="round"/><polygon points="50,32 65.6,41 65.6,59 50,68 34.4,59 34.4,41" fill="none" stroke="#3CD6F0" stroke-width="2.5" stroke-linejoin="round"/><path d="M50 6 L50 32 M88.1 28 L65.6 41 M88.1 72 L65.6 59 M50 94 L50 68 M11.9 72 L34.4 59 M11.9 28 L34.4 41" stroke="#3CD6F0" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8"/><circle cx="50" cy="32" r="3" fill="#fff"/><circle cx="65.6" cy="41" r="3" fill="#fff"/><circle cx="65.6" cy="59" r="3" fill="#fff"/><circle cx="50" cy="68" r="3" fill="#fff"/><circle cx="34.4" cy="59" r="3" fill="#fff"/><circle cx="34.4" cy="41" r="3" fill="#fff"/><circle cx="50" cy="50" r="5" fill="#3CD6F0"/></svg><span>turtle <em>ad</em></span></div>
<div class="ab tagr">KAGOSHIMA ｜ WEB × AI</div>

<!-- headline: one sentence across three tiles, one gradient -->
<svg class="layer" viewBox="0 0 3128 1350">
 <defs>
  <linearGradient id="hl" gradientUnits="userSpaceOnUse" x1="300" y1="0" x2="2800" y2="0">
   <stop offset="0" stop-color="#e6ecff"/><stop offset=".35" stop-color="#c9d4f0"/><stop offset=".55" stop-color="#4fe3ff"/><stop offset="1" stop-color="#9b7dff"/>
  </linearGradient>
 </defs>
 <g font-family="Noto Sans JP" font-weight="900" font-size="124" fill="url(#hl)">
  <text x="990" y="380" text-anchor="end">鹿児島の</text>

  <text x="2140" y="380" text-anchor="start">まるごと。</text>
 </g>
</svg>

<!-- bottom services -->
<div class="ab svc" style="left:110px"><div class="no">01  AI SUPPORT</div><div class="nm">AI活用サポート</div><div class="ds">ChatGPT・Claude ｜ <b>初回相談無料</b></div></div>
<div class="ab svc" style="left:1164px;width:800px;text-align:center"><div class="no">02  WEB DESIGN</div><div class="nm">ホームページ制作</div><div class="ds"><b>55,000円〜</b> ｜ 修正・月額管理も</div></div>
<div class="ab svc" style="left:2158px"><div class="no">03  AI MOVIE</div><div class="nm">AI動画作成</div><div class="ds">縦型動画 1本 <b>9,800円</b></div></div>
</div></body></html>
