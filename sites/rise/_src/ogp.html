<!doctype html><html lang="ja"><head><meta charset="utf-8">
<!-- OGP画像（1200x630）の元。_src/shoot.js で img/ogp.jpg に書き出し -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700;900&family=Noto+Serif+JP:wght@900&family=Cormorant+Garamond:ital,wght@1,700&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{width:1200px;height:630px;overflow:hidden;position:relative;font-family:"Noto Sans JP";background:#9c7128}
.g{position:absolute;inset:0 0 92px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:5px;border-bottom:5px solid #9c7128}
.c{position:relative;overflow:hidden}.c img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.c::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(10,34,22,.8),rgba(10,34,22,0) 60%)}
.c b{position:absolute;z-index:2;bottom:14px;color:#fff;font-weight:900;font-size:44px;text-shadow:0 3px 10px rgba(0,0,0,.5)}
.c1 b,.c3 b{left:24px}.c2 b,.c4 b{right:24px}
.bd{position:absolute;left:50%;top:268px;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;padding:8px;background:linear-gradient(135deg,#a77a2c 0%,#f1d999 28%,#c39a48 52%,#f6e3a6 74%,#a77a2c 100%);box-shadow:0 10px 30px rgba(0,0,0,.45);z-index:5}
.in{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 50% 35%,#fffaf1 0,#fbf3e4 60%,#f2e2c8 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Noto Serif JP";font-weight:900;color:#1d3a2b}
.r{display:flex;align-items:flex-end}.n{font-size:126px;line-height:.82;background:linear-gradient(180deg,#fff1c4 0%,#e3bf6a 38%,#a87a2a 62%,#e6c878 100%);-webkit-background-clip:text;color:transparent}
.t1{font-size:33px;padding-bottom:10px}.t2{font-size:35px;line-height:1.15;margin-top:6px;text-align:center}.t2 em{font-style:normal;color:#1d5a3e}
.ft{position:absolute;left:0;right:0;bottom:0;height:92px;background:linear-gradient(180deg,#1d5a3e,#123d29);display:flex;align-items:center;justify-content:space-between;padding:0 34px}
.ft img{height:34px;background:#fbfcf6;padding:9px 14px;border-radius:8px;box-sizing:content-box}
.ft p{color:#fff;font-weight:900;font-size:30px}.ft p small{display:block;font-size:17px;color:#e9cf8a;font-weight:700;text-align:right}
</style></head><body>
<div class="g"><div class="c c1"><img src="../img/ai-waist.jpg" style="object-position:62% 45%"><b>ダイエット</b></div><div class="c c2"><img src="../img/r-treat3.jpg" style="object-position:40% 40%"><b>整体</b></div><div class="c c3"><img src="../img/ikumou.jpg" style="object-position:30% 40%"><b>育毛</b></div><div class="c c4"><img src="../img/hada.jpg" style="object-position:45% 40%"><b>肌質改善</b></div></div>
<div class="bd"><div class="in"><div class="r"><span class="n">4</span><span class="t1">つの悩みを、</span></div><div class="t2"><em>ひとつ</em>の<br>サロンで。</div></div></div>
<div class="ft"><img src="../img/logo.png"><p><small>鹿児島県指宿市・鹿児島市谷山</small>指宿院・谷山院</p></div>
</body></html>
