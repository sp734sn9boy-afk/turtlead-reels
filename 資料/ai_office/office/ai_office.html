<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>タートルアドのAIオフィス</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=M+PLUS+Rounded+1c:wght@800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#14245a;--navy2:#081024;--navy3:#04070f;--cyan:#3CD6F0;--violet:#b9a6ff;
  --text:#f2f6ff;--sub:#b9c6e8;--dim:#7f8fb8;
  --s:64px;      /* キャラ1体の大きさ（64ドット×1） */
  --cell:80px;   /* 机1つ分の幅 */
}
@media (min-width:1000px){:root{--s:96px;--cell:116px}}
*{margin:0;padding:0;box-sizing:border-box}
html{background:#04070f}
body{font-family:'Noto Sans JP',sans-serif;font-feature-settings:"palt";color:var(--text);min-height:100vh;
  background:radial-gradient(120% 60% at 50% 0%,#14245a 0%,#081024 55%,#04070f 100%) fixed;overflow-x:hidden}
.wrap{max-width:1240px;margin:0 auto;padding:16px 16px 96px}

/* ---- 見出し ---- */
.head{display:flex;align-items:center;gap:10px}
.head img{width:34px;height:34px;border-radius:9px}
.brand{font-family:'M PLUS Rounded 1c',sans-serif;font-weight:800;font-size:17px;letter-spacing:.02em}
.brand b{color:var(--cyan)}
h1{margin:8px 0 8px;font-weight:900;font-size:26px;line-height:1.2;letter-spacing:.02em}
h1 span{background:linear-gradient(90deg,#4fe3ff,#b9a6ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.stats{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:13px;font-weight:700;padding:5px 11px;border-radius:999px;background:rgba(60,214,240,.10);border:1.5px solid rgba(60,214,240,.45);white-space:nowrap}
.pill b{color:#4fe3ff;font-size:16px;font-weight:900}
.pill.m{border-color:rgba(185,166,255,.5);background:rgba(185,166,255,.10)}
.pill.m b{color:var(--violet)}
.how{margin-top:8px;font-size:12px;color:var(--sub);line-height:1.6}
.note{margin-top:2px;font-size:11px;color:var(--dim)}
@media (min-width:1000px){h1{font-size:38px}.brand{font-size:20px}.head img{width:40px;height:40px}.pill{font-size:15px}.pill b{font-size:19px}.how{font-size:14px}.note{font-size:12px}}

/* ---- 床と島 ---- */
.floor{position:relative;margin-top:14px;padding:12px 0 14px;border-radius:16px;
  display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-content:flex-start;align-items:flex-start;
  background-color:#0b1634;
  background-image:linear-gradient(rgba(60,214,240,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(60,214,240,.06) 1px,transparent 1px);
  background-size:16px 16px;border:2px solid rgba(60,214,240,.18)}
.island{position:relative;padding:38px 4px 4px;border-radius:12px;
  background:color-mix(in srgb,var(--dc) 9%,#0e1b40);border:2px solid color-mix(in srgb,var(--dc) 55%,transparent);
  box-shadow:0 4px 0 rgba(0,0,0,.35)}
.island .lbl{position:absolute;left:8px;top:5px;display:flex;align-items:center;gap:5px;font-size:12px;font-weight:900;white-space:nowrap}
.island .lbl i{width:10px;height:10px;background:var(--dc);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.island .lbl em{font-style:normal;font-weight:700;color:var(--sub);font-size:11px}
.desks{display:grid;grid-template-columns:repeat(var(--cols),var(--cell));justify-content:center}
.slot{width:var(--cell);display:flex;flex-direction:column;align-items:center;padding-bottom:4px}
.slot canvas{width:var(--s);height:var(--s);image-rendering:pixelated;display:block}
.tag{margin-top:1px;max-width:calc(var(--cell) - 2px);font-size:10px;font-weight:700;line-height:1.25;text-align:center;
  padding:1px 5px;border-radius:5px;background:rgba(4,7,15,.72);border-bottom:2px solid var(--dc);white-space:nowrap}
.tag.wrap{white-space:normal}
.tag small{display:block;font-size:8.5px;font-weight:500;color:var(--sub)}
@media (min-width:1000px){.floor{gap:12px}.island{padding:46px 6px 4px}.island .lbl{font-size:14px}.island .lbl em{font-size:13px}.tag{font-size:12.5px}.tag small{font-size:10px}}
.mach .slot{width:calc(var(--cell) + 26px)}
.mach .tag{white-space:normal;max-width:none}
.room .tag{white-space:normal}
.lamp{position:absolute;width:6px;height:6px;border-radius:2px}

/* ---- キャラ（床の上を動く） ---- */
.actors{position:absolute;inset:0;pointer-events:none}
.actor{position:absolute;left:0;top:0;width:var(--s);height:var(--s);will-change:transform}
.actor canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.actor.flip canvas{transform:scaleX(-1)}
.actor.walking{z-index:30}
.actor.away{z-index:25}
.actor.walking canvas{animation:bob .36s steps(2) infinite}
@keyframes bob{50%{translate:0 -2px}}
.actor .glow{position:absolute;left:12%;right:12%;bottom:4%;height:44%;border-radius:50%;
  background:radial-gradient(closest-side,rgba(60,214,240,.55),transparent);opacity:0;pointer-events:none}
.actor.working .glow{animation:pico 1s steps(2) infinite}
@keyframes pico{0%{opacity:.25}50%{opacity:.85}}
.actor .ring{position:absolute;left:4%;right:4%;bottom:-6%;height:24%;border-radius:50%;border:2px solid #ffe27a;opacity:0;transition:opacity .3s}
.actor.focus .ring{opacity:.9;animation:ring 1.2s ease-in-out infinite}
@keyframes ring{50%{transform:scale(1.12)}}

.bub{position:absolute;left:50%;bottom:calc(100% - 6px);transform:translateX(calc(-50% + var(--dx,0px)));
  font-size:11px;font-weight:700;line-height:1.35;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .2s;z-index:40}
.bub.on{opacity:1}
.actor.away .bub.say{bottom:calc(100% + 14px)} /* 席の人の「作業中」チップと重ならないよう少し上 */
.bub.say{background:#fff;color:#0b1634;padding:4px 8px;border-radius:9px;box-shadow:0 2px 0 rgba(0,0,0,.35);white-space:normal;width:max-content;max-width:150px;text-align:center}
.bub.say::after{content:"";position:absolute;left:calc(50% - var(--dx,0px) - 5px);bottom:-5px;border:5px solid transparent;border-bottom:0;border-top-color:#fff}
.bub.chip{background:rgba(8,16,36,.92);color:#e9f2ff;padding:2px 7px;border-radius:999px;border:1.5px solid var(--dc);font-size:10px}
.bub.chip::before{content:"";display:inline-block;width:6px;height:6px;margin-right:4px;border-radius:50%;background:var(--cyan);animation:pico .8s steps(2) infinite;vertical-align:1px}
.bub.no{background:#fff;color:#d0203a}
@media (min-width:1000px){.bub{font-size:13px}.bub.say{max-width:190px}.bub.chip{font-size:12px}}

.pop{position:absolute;z-index:45;font-size:11px;font-weight:900;padding:4px 9px;border-radius:8px;white-space:nowrap;pointer-events:none;
  background:#e9fff2;color:#0b4a2a;box-shadow:0 2px 0 rgba(0,0,0,.4);animation:popup 2.6s ease-out forwards}
.pop.ph{background:#fff6d6;color:#6a4700}
@keyframes popup{0%{opacity:0;transform:translate(-50%,6px) scale(.9)}12%{opacity:1;transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-14px)}}
@media (min-width:1000px){.pop{font-size:13px}}

/* ---- 下の1行（いま起きていること） ---- */
.ticker{position:fixed;left:0;right:0;bottom:0;z-index:100;padding:8px 12px calc(8px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(8,16,36,.86),rgba(4,7,15,.97));border-top:2px solid rgba(60,214,240,.5);backdrop-filter:blur(4px);cursor:pointer}
.ticker .in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:8px}
.ticker .now{flex:none;font-size:11px;font-weight:900;color:#081024;background:var(--cyan);padding:3px 8px;border-radius:999px;display:flex;align-items:center;gap:5px}
.ticker .now::before{content:"";width:7px;height:7px;border-radius:50%;background:#ff4060;animation:pico 1s steps(2) infinite}
.ticker .msg{font-size:13px;font-weight:700;line-height:1.4;transition:opacity .25s}
.ticker .msg.fade{opacity:0}
@media (min-width:1000px){.ticker .msg{font-size:17px}.ticker .now{font-size:13px}}
</style>
</head>

<script>
'use strict';
// ---- ドット絵エンジン（資料/ai_office/characters/src から自動で取り込み）----
const P = (function () {
// タートルアド AI社員 キャラクター：ドット絵エンジン（64x64格子）
// 自作。外部素材なし。ロゴ（六角形＝亀の甲羅、ノードと線）をもとに描く。
'use strict';
const W = 64, H = 64;
const OUT = '#060b18'; // 輪郭線（ブランドの最暗色に近い紺黒）

class Grid {
  constructor() { this.px = new Array(W * H).fill(null); }
  get(x, y) { return (x < 0 || y < 0 || x >= W || y >= H) ? null : this.px[y * W + x]; }
  set(x, y, c) { if (x >= 0 && y >= 0 && x < W && y < H && c) this.px[y * W + x] = c; }
  // mask: [[x,y],...] / color: (x,y,box)=>色 / outline: 外側1pxの輪郭を先に塗る
  part(mask, color, { outline = true, outColor = OUT } = {}) {
    if (!mask.length) return;
    const key = new Set(mask.map(([x, y]) => y * W + x));
    if (outline) {
      for (const [x, y] of mask) for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const k = (y + dy) * W + (x + dx);
        if (!key.has(k)) this.set(x + dx, y + dy, outColor);
      }
    }
    const xs = mask.map(p => p[0]), ys = mask.map(p => p[1]);
    const box = { x0: Math.min(...xs), x1: Math.max(...xs), y0: Math.min(...ys), y1: Math.max(...ys) };
    box.w = box.x1 - box.x0 + 1; box.h = box.y1 - box.y0 + 1;
    for (const [x, y] of mask) this.set(x, y, typeof color === 'function' ? color(x, y, box, key) : color);
  }
  dot(pts, c) { for (const [x, y] of pts) this.set(x, y, c); }
}

// ---- 形（ピクセル中心で判定） ----
const all = f => { const r = []; for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (f(x + .5, y + .5)) r.push([x, y]); return r; };
const ellipse = (cx, cy, rx, ry) => all((x, y) => ((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2 <= 1);
const rect = (x0, y0, x1, y1) => { const r = []; for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) r.push([x, y]); return r; };
const roundRect = (x0, y0, x1, y1, rad) => all((x, y) => {
  if (x < x0 || x > x1 + 1 || y < y0 || y > y1 + 1) return false;
  const cx = Math.min(Math.max(x, x0 + rad), x1 + 1 - rad), cy = Math.min(Math.max(y, y0 + rad), y1 + 1 - rad);
  return (x - cx) ** 2 + (y - cy) ** 2 <= rad * rad;
});
const polygon = pts => all((x, y) => {
  let inside = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const [xi, yi] = pts[i], [xj, yj] = pts[j];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
});
// とがった頂点が上の六角形（ロゴと同じ向き）
const hexPts = (cx, cy, r) => [0, 1, 2, 3, 4, 5].map(i => { const a = Math.PI / 180 * (-90 + 60 * i); return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; });
const hex = (cx, cy, r) => polygon(hexPts(cx, cy, r));
const line = (x0, y0, x1, y1) => { // ブレゼンハム
  const r = []; x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1; let e = dx + dy;
  for (;;) { r.push([x0, y0]); if (x0 === x1 && y0 === y1) break; const e2 = 2 * e; if (e2 >= dy) { e += dy; x0 += sx; } if (e2 <= dx) { e += dx; y0 += sy; } }
  return r;
};
const thick = (pts, w = 2) => { const s = new Map(); for (const [x, y] of pts) for (let i = 0; i < w; i++) for (let j = 0; j < w; j++) s.set((y + j) * W + x + i, [x + i, y + j]); return [...s.values()]; };
const minus = (a, b) => { const k = new Set(b.map(([x, y]) => y * W + x)); return a.filter(([x, y]) => !k.has(y * W + x)); };
const union = (...ms) => { const s = new Map(); for (const m of ms) for (const [x, y] of m) s.set(y * W + x, [x, y]); return [...s.values()]; };

// 立体感：左が奥（側面）＝暗く、右上が明るい（少し右を向いている）
const shade = (light, base, dark, { side = .22, top = .3 } = {}) => (x, y, b) => {
  const u = (x - b.x0) / Math.max(1, b.w - 1), v = (y - b.y0) / Math.max(1, b.h - 1);
  if (u < side) return dark;
  if (v < top && u > .5) return light;
  return base;
};

// ---- SVG化（横に並んだ同じ色をまとめる） ----
function toSVG(g, { scale = 8, pad = 0 } = {}) {
  let s = '';
  for (let y = 0; y < H; y++) {
    let x = 0;
    while (x < W) {
      const c = g.get(x, y); if (!c) { x++; continue; }
      let n = 1; while (x + n < W && g.get(x + n, y) === c) n++;
      s += `<rect x="${x}" y="${y}" width="${n}" height="1" fill="${c}"/>`;
      x += n;
    }
  }
  const size = (W + pad * 2) * scale;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${-pad} ${-pad} ${W + pad * 2} ${H + pad * 2}" width="${size}" height="${size}" shape-rendering="crispEdges">${s}</svg>`;
}

return { W, H, OUT, Grid, ellipse, rect, roundRect, polygon, hex, hexPts, line, thick, minus, union, shade, toSVG };

})();
const CH = (function (P) {
// タートルアド AI社員：6体の定義とポーズ
// 体は全員共通（ロゴの六角形＝亀の甲羅の胴体、画面の顔、アンテナ）。担当ごとに差し色と小物を変える。

// ブランド色

  plate: '#0f3c46', plateDark: '#0a2a34', spoke: '#2bb4cf', rimLight: '#b4f5ff',
  white: '#ffffff', blush: '#ff9fc4',

// 担当（差し色は1体1色）
const ROLES = [

  { id: 'design', ja: 'デザイン担当', en: 'DESIGN', job: '画像・チラシ・見た目をそろえる', accent: '#ff8fd0', accentDark: '#c9479a', item: 'ベレー帽・ペン' },
  { id: 'sales', ja: '営業担当', en: 'SALES', job: '案件の見極め・見積もり', accent: '#ff5468', accentDark: '#b51f36', item: 'ネクタイ・名刺' },
  { id: 'listing', ja: '出品・発信担当', en: 'POST', job: '出品ページ・SNSの投稿', accent: '#5ee38f', accentDark: '#1f9a54', item: 'メガホン' },
  { id: 'automation', ja: '仕組み担当', en: 'SYSTEM', job: '自動化・ホームページ公開', accent: '#ff9a3d', accentDark: '#b85b0e', item: 'ヘルメット・スパナ・ケーブル' },
  { id: 'research', ja: '調べもの担当', en: 'RESEARCH', job: '調べて裏付けをとる', accent: '#b9a6ff', accentDark: '#6f58d6', item: '虫めがね・丸めがね' },
];

const dk = c => { // 少し暗く
  const n = parseInt(c.slice(1), 16), f = .62; const r = (n >> 16) * f, g = ((n >> 8) & 255) * f, b = (n & 255) * f;
  return '#' + [r, g, b].map(v => Math.round(v).toString(16).padStart(2, '0')).join('');

// pose: 'stand' | 'type'（待機：パソコンを打つ） | 'work'（仕事中：画面が光る） | 'talk'（話す） | 'stretch'（席で伸び）
// opt.tap: 1|2 打つ手を1ドット上げる（キーを打つコマ） / opt.step: 1|2 片足を上げる（歩くコマ）
function build(role, pose = 'stand', opt = {}) {

const $ = (q, el = document) => el.querySelector(q);

let geo = { fx: 0, fy: 0, fw: 0, size: 64 };
const posOf = (el) => { const r = el.getBoundingClientRect(); return { x: r.left - geo.fx, y: r.top - geo.fy, w: r.width, h: r.height }; };
function measure() {
  const r = floor.getBoundingClientRect(); geo.fx = r.left; geo.fy = r.top; geo.fw = r.width;
  geo.size = SLOTS.ceo.getBoundingClientRect().width;
}
const home = (id) => posOf(SLOTS[id]);

  if (x + s > geo.fw - 2) { x = p.x - s * 0.66; flip = false; }
  if (x < 2) { x = p.x + s * 0.66; flip = true; }
  return { x, y: p.y + s * 0.1, flip };

// ---- 吹き出し ----
function showBubble(a) {
  const b = a.bub;
  let text = '', cls = '';
  if (a.sayText) { text = a.sayText; cls = 'say' + (a.sayNo ? ' no' : ''); }
  else if (a.chip) { text = a.chip; cls = 'chip'; }
  if (!text) { b.classList.remove('on'); return; }
  if (b.dataset.t !== text || b.dataset.c !== cls) {
    b.dataset.t = text; b.dataset.c = cls; b.className = 'bub ' + cls; b.textContent = text; b.style.setProperty('--dx', '0px');
  }
  b.classList.add('on');

}
function fitBubble(a) {
  const b = a.bub; if (!b.classList.contains('on')) return;
  const r = b.getBoundingClientRect(), fl = geo.fx + 4, fr = geo.fx + geo.fw - 4;
  const cur = parseFloat(b.style.getPropertyValue('--dx')) || 0;
  let dx = cur;
  if (r.left < fl) dx = cur + (fl - r.left);
  else if (r.right > fr) dx = cur - (r.right - fr);
  if (Math.abs(dx - cur) > .5) b.style.setProperty('--dx', dx + 'px');

// ---- 毎フレームの更新 ----
let lastT = performance.now();
function tick(t) {
  const dt = Math.min(64, t - lastT) / 1000; lastT = t;
  measure(); // 床の位置（スクロール・画面幅の変化に追従）
  const speed = geo.size * 2.3;
  for (const id in A) {
    const a = A[id];
    // 位置
    if (a.mode === 'seat') { const h = home(id); a.x = h.x; a.y = h.y; }
    else if (a.mode === 'walk') {
      const tg = a.target(); const dx = tg.x - a.x, dy = tg.y - a.y, d = Math.hypot(dx, dy), step = speed * dt;
      if (Math.abs(dx) > 1) a.el.classList.toggle('flip', dx < 0);
      if (d <= step) { a.x = tg.x; a.y = tg.y; const f = a.onArrive; a.onArrive = null; f && f(tg); }
      else { a.x += dx / d * step; a.y += dy / d * step; }
    } else if (a.mode === 'stand' && a.target) { const tg = a.target(); a.x = tg.x; a.y = tg.y; }
    a.el.style.transform = `translate3d(${a.x.toFixed(1)}px,${a.y.toFixed(1)}px,0)`;
    // コマ
    let key;
    const ph = t + a.phase;
    if (a.mode === 'seat') {
      if (a.working) key = 'work' + (Math.floor(ph / 200) % 2 + 1);
      else {
        if (a.idle !== 'type' && t > a.idleUntil) a.idle = 'type';
        if (a.idle === 'type') key = (Math.floor(ph / 2600) % 3 === 2) ? 'type1' : 'type' + (Math.floor(ph / 260) % 2 + 1);
        else key = a.idle;
      }
    } else if (a.mode === 'walk') key = (a.carrying ? 'carry' : 'stand') + (Math.floor(ph / 180) % 2 + 1);
    else key = a.talking ? 'talk' : (a.carrying ? 'carry' : 'stand');
    if (key !== a.last) { paint(a.c, frame(a.s, key)); a.last = key; }
    a.el.classList.toggle('working', a.mode === 'seat' && a.working);
    a.el.classList.toggle('walking', a.mode === 'walk');
    a.el.classList.toggle('away', a.mode !== 'seat');
    if (a.mode !== 'seat') fitBubble(a);
  }
  // 機械のランプ
  const mf = Math.floor(t / 450);
  for (const m of MACHINES) { const f = (mf + MACHINES.indexOf(m)) % 4; if (m.f !== f) { paint(m.canvas, m.frames[f]); m.f = f; } }
  const wf = Math.floor(t / 700) % 3; if (wf !== winF) { paint(PLACES.window, winFrames[wf]); winF = wf; }
  requestAnimationFrame(tick);
}
let winF = -1, winFrames = [];

// ---- ひまなときのしぐさ（伸び・本を読む） ----
function idleLoop() {
  const now = performance.now();
  const free = Object.values(A).filter(a => a.mode === 'seat' && !a.working && a.locks === 0 && a.idle === 'type');
  if (free.length) {
    const a = free[Math.floor(Math.random() * free.length)];
    if (Math.random() < .45) { a.idle = 'stretch'; a.idleUntil = now + 1600; }
    else { a.idle = 'read'; a.idleUntil = now + 4200; }
  }
  setTimeout(idleLoop, 1400 + Math.random() * 1600);
}

// =====================================================================
// 物語を動かす道具
// =====================================================================
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const LOCK = {};
async function lock(...ids) { // 同じ社員を2つの話で同時に動かさない
  ids = [...new Set(ids)].sort();
  for (const id of ids) { while (LOCK[id]) await LOCK[id]; let rel; LOCK[id] = new Promise(r => rel = r); LOCK[id].rel = rel; A[id].locks++; }
  return () => { for (const id of ids) { const p = LOCK[id]; LOCK[id] = null; A[id].locks--; p.rel(); } };
}
let focusIds = [];
const msgEl = $('#msg');
function log(text, ...ids) {
  msgEl.classList.add('fade');
  setTimeout(() => { msgEl.textContent = text; msgEl.classList.remove('fade'); }, 220);
  for (const id of focusIds) A[id] && A[id].el.classList.remove('focus');
  focusIds = ids; for (const id of ids) A[id] && A[id].el.classList.add('focus');
}
$('#ticker').addEventListener('click', () => { const a = A[focusIds[0]]; if (a) a.el.scrollIntoView({ behavior: 'smooth', block: 'center' }); });

function walk(id, targetFn) {
  const a = A[id];
  return new Promise(res => {
    a.mode = 'walk'; a.target = targetFn; a.idle = 'type';
    a.onArrive = (tg) => { a.mode = 'stand'; a.el.classList.toggle('flip', !!tg.flip); res(); };
  });
}
const go = (id, to, side = 1) => walk(id, () => visitPoint(SLOTS[to] || PLACES[to], side));
const goPlace = (id, place) => walk(id, () => { const p = posOf(PLACES[place]), s = geo.size; return { x: Math.min(p.x + s * 0.25, geo.fw - s - 2), y: p.y + s * 0.42, flip: false }; });
async function back(id) {
  const a = A[id]; a.talking = false; a.sayText = ''; showBubble(a);
  await walk(id, () => home(id));
  a.mode = 'seat'; a.target = null; a.el.classList.remove('flip'); a.carrying = false; showBubble(a);
}
async function say(id, text, ms = 2200, no = false) {
  const a = A[id]; a.sayText = text; a.sayNo = no; a.talking = a.mode !== 'seat'; showBubble(a);
  await sleep(ms);
  a.sayText = ''; a.talking = false; showBubble(a);
}
function work(id, label) { const a = A[id]; a.working = true; a.chip = label; a.idle = 'type'; showBubble(a); }
function rest(id) { const a = A[id]; a.working = false; a.chip = ''; showBubble(a); }
function carry(id, on = true) { A[id].carrying = on; }
function pop(el, text, cls = '') {
  const p = posOf(el), d = document.createElement('div');
  d.className = 'pop ' + cls; d.textContent = text;
  d.style.left = Math.max(60, Math.min(geo.fw - 60, p.x + p.w / 2)) + 'px'; d.style.top = (p.y - 12) + 'px';
  actorsLayer.append(d); setTimeout(() => d.remove(), 2700);
}

async function machines(stop) { // 機械室：24時間ずっと
  const items = [['m_insta', 'Instagram投稿完了'], ['m_line', 'LINE通知を送信'], ['m_folder', '新刊フォルダ：見張り中']];
  let i = 0;
  while (!stop.done) {
    const [id, text] = items[i % 3];
    pop(PLACES[id], text);
    if (i % 3 === 0 && i % 2 === 0) log('機械室：Instagramの自動投稿が完了');
    i++;
    await sleep(7000);
  }
}
async function resetAll() {
  for (const id in A) { rest(id); A[id].carrying = false; }
  await Promise.all(Object.keys(A).filter(id => A[id].mode !== 'seat').map(back));
}
async function play() {
  for (;;) {
    const stop = { done: false };
    machines(stop);
    await Promise.all([storyMap(), storySales(), storyResearch(), storyOps(), storyNeo(), storyHP()]);
    log('今日の仕事がひと通り終わりました。また最初から再生します');
    await sleep(4000);
    stop.done = true;
    await resetAll();
    await sleep(1000);
  }
}

// ---- はじめる ----
buildFloor();
winFrames = [0, 1, 2].map(f => toCanvas(drawWindow(f)));
makeActors();
measure();
new ResizeObserver(() => { measure(); for (const id in A) showBubble(A[id]); }).observe(floor);
addEventListener('resize', measure);
document.fonts && document.fonts.ready.then(measure);
requestAnimationFrame(t => { lastT = t; tick(t); });
setTimeout(idleLoop, 2500);
setTimeout(play, 800);
