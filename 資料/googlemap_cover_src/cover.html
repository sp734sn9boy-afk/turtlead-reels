<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<title>Googleマップ カバー写真</title>
<!-- フォント：turtle-ad.com と同じ Google Fonts（Noto Sans JP / M PLUS Rounded 1c / Outfit。いずれもSIL OFL） -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=M+PLUS+Rounded+1c:wght@800&family=Outfit:wght@500;700&display=block" rel="stylesheet">
<style>
:root{--bg:#060b18;--cyan:#4fe3ff;--logo:#3CD6F0;--violet:#b9a6ff;--text:#f2f6ff;--sub:#c9d4f0}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden}
body{background:radial-gradient(60% 100% at 50% 40%,#14245a 0%,#081024 55%,#04070f 100%);color:var(--text);
  font-family:'Noto Sans JP',sans-serif;font-feature-settings:"palt";position:relative}
.bg{position:absolute;inset:0}
/* 文字とロゴは中央の幅800px（x=560〜1360）にすべて収める。スマホの写真表示（中央約860×1080）で切れないため */
.safe{position:absolute;left:560px;top:0;width:800px;height:1080px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.guide .safe{outline:3px dashed #ff5a5a}
.guide .safe::after{content:"";position:absolute;left:-30px;top:0;width:860px;height:1080px;outline:3px dashed #ffd84f}
.logo{display:flex;align-items:center;gap:20px;font-family:'M PLUS Rounded 1c',sans-serif;font-weight:800;font-size:88px;line-height:1;letter-spacing:.02em;color:#fff}
.logo svg{width:116px;height:116px;overflow:visible;filter:drop-shadow(0 0 12px rgba(60,214,240,.75))}
.logo b{color:var(--logo);text-shadow:0 0 20px rgba(60,214,240,.6)}
.corp{margin-top:14px;font-size:32px;font-weight:700;letter-spacing:.06em;color:var(--sub)}
.rule{width:110px;height:4px;border-radius:2px;margin:30px 0 26px;background:linear-gradient(90deg,var(--cyan),var(--violet))}
.catch{font-weight:900;line-height:1.12;letter-spacing:.02em}
.catch span{display:block}
.catch .s{font-size:60px;color:var(--cyan)}
.catch .m{font-size:92px;margin-top:6px;color:#fff}
.catch .l{font-size:132px;line-height:1.05;background:linear-gradient(90deg,var(--cyan) 0%,var(--violet) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(79,227,255,.25))}
.pill{margin-top:34px;padding:18px 44px 20px;border-radius:36px;font-weight:700;line-height:1.4;color:#fff;
  background:rgba(79,227,255,.10);border:2px solid rgba(79,227,255,.55);box-shadow:0 0 28px rgba(79,227,255,.25)}
.pill span{display:block}
.pill .a{font-size:36px;color:var(--sub)}
.pill .b{font-size:46px}
.pill em{font-style:normal;color:var(--cyan)}
</style></head>
<body>
<svg class="bg" viewBox="0 0 1920 1080" aria-hidden="true">
  <defs>
    <pattern id="hex" width="120" height="207.84" patternUnits="userSpaceOnUse">
      <path d="M60 0 L120 34.64 L120 103.92 L60 138.56 L0 103.92 L0 34.64 Z M60 138.56 L60 207.84" fill="none" stroke="#3CD6F0" stroke-width="1.6"/>
    </pattern>
    <!-- 中央は暗く、左右に行くほど模様が濃くなる -->
    <linearGradient id="side" x1="0" x2="1">
      <stop offset="0" stop-color="#fff"/><stop offset=".2" stop-color="#bbb"/><stop offset=".3" stop-color="#000"/>
      <stop offset=".7" stop-color="#000"/><stop offset=".8" stop-color="#bbb"/><stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <mask id="m"><rect width="1920" height="1080" fill="url(#side)"/></mask>
    <radialGradient id="glowL" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#3CD6F0" stop-opacity=".22"/><stop offset="1" stop-color="#3CD6F0" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowR" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#8b6bff" stop-opacity=".22"/><stop offset="1" stop-color="#8b6bff" stop-opacity="0"/></radialGradient>
    <g id="bighex"><polygon points="0,-1 .866,-.5 .866,.5 0,1 -.866,.5 -.866,-.5" fill="none" stroke-linejoin="round"/></g>
  </defs>
  <ellipse cx="260" cy="560" rx="420" ry="460" fill="url(#glowL)"/>
  <ellipse cx="1660" cy="520" rx="420" ry="460" fill="url(#glowR)"/>
  <rect width="1920" height="1080" fill="url(#hex)" opacity=".5" mask="url(#m)"/>
  <!-- 左右の大きな六角形（ロゴの亀甲モチーフ） -->
  <g stroke="#3CD6F0" fill="none" stroke-linejoin="round">
    <polygon transform="translate(250 540) scale(230)" points="0,-1 .866,-.5 .866,.5 0,1 -.866,.5 -.866,-.5" stroke-width=".012" opacity=".55"/>
    <polygon transform="translate(250 540) scale(120)" points="0,-1 .866,-.5 .866,.5 0,1 -.866,.5 -.866,-.5" stroke-width=".02" opacity=".7"/>
    <path d="M250 310 V420 M449 425 L354 480 M449 655 L354 600 M250 770 V660 M51 655 L146 600 M51 425 L146 480" stroke-width="2.5" opacity=".45"/>
    <polygon transform="translate(1670 540) scale(230)" points="0,-1 .866,-.5 .866,.5 0,1 -.866,.5 -.866,-.5" stroke="#b9a6ff" stroke-width=".012" opacity=".5"/>
    <polygon transform="translate(1670 540) scale(120)" points="0,-1 .866,-.5 .866,.5 0,1 -.866,.5 -.866,-.5" stroke="#b9a6ff" stroke-width=".02" opacity=".65"/>
    <path d="M1670 310 V420 M1869 425 L1774 480 M1869 655 L1774 600 M1670 770 V660 M1471 655 L1566 600 M1471 425 L1566 480" stroke="#b9a6ff" stroke-width="2.5" opacity=".4"/>
  </g>
  <g fill="#fff">
    <circle cx="250" cy="420" r="7" opacity=".85"/><circle cx="354" cy="480" r="7" opacity=".85"/><circle cx="354" cy="600" r="7" opacity=".85"/>
    <circle cx="250" cy="660" r="7" opacity=".85"/><circle cx="146" cy="600" r="7" opacity=".85"/><circle cx="146" cy="480" r="7" opacity=".85"/>
    <circle cx="1670" cy="420" r="7" opacity=".8"/><circle cx="1774" cy="480" r="7" opacity=".8"/><circle cx="1774" cy="600" r="7" opacity=".8"/>
    <circle cx="1670" cy="660" r="7" opacity=".8"/><circle cx="1566" cy="600" r="7" opacity=".8"/><circle cx="1566" cy="480" r="7" opacity=".8"/>
    <circle cx="90" cy="140" r="5" opacity=".5"/><circle cx="430" cy="930" r="5" opacity=".5"/><circle cx="1830" cy="950" r="5" opacity=".5"/><circle cx="1490" cy="130" r="5" opacity=".5"/>
  </g>
  <circle cx="250" cy="540" r="16" fill="#3CD6F0" opacity=".8"/>
  <circle cx="1670" cy="540" r="16" fill="#b9a6ff" opacity=".75"/>
</svg>

<div class="safe">
  <div class="logo">
    <!-- ロゴマーク：turtle-ad.com のヘッダーで使っている自社SVGをそのまま使用 -->
    <svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="50,6 88.1,28 88.1,72 50,94 11.9,72 11.9,28" fill="#0D3A34" stroke="#3CD6F0" stroke-width="3" stroke-linejoin="round"/><polygon points="50,32 65.6,41 65.6,59 50,68 34.4,59 34.4,41" fill="none" stroke="#3CD6F0" stroke-width="2.5" stroke-linejoin="round"/><path d="M50 6 L50 32 M88.1 28 L65.6 41 M88.1 72 L65.6 59 M50 94 L50 68 M11.9 72 L34.4 59 M11.9 28 L34.4 41" stroke="#3CD6F0" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8"/><g fill="#fff"><circle cx="50" cy="32" r="3"/><circle cx="65.6" cy="41" r="3"/><circle cx="65.6" cy="59" r="3"/><circle cx="50" cy="68" r="3"/><circle cx="34.4" cy="59" r="3"/><circle cx="34.4" cy="41" r="3"/></g><circle cx="50" cy="50" r="5" fill="#3CD6F0"/></svg>
    <span>turtle <b>ad</b></span>
  </div>
  <p class="corp">合同会社turtle ad（タートルアド）</p>
  <div class="rule"></div>
  <h1 class="catch"><span class="s">鹿児島の</span><span class="m">ホームページ制作</span><span class="l">AI動画</span></h1>
  <p class="pill"><span class="a">作る前に、</span><span class="b"><em>トップページの見本</em>を</span><span class="b">無料でお作りします</span></p>
</div>
</body></html>
