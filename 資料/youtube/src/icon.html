<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<title>YouTube チャンネルアイコン</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:800px;height:800px;overflow:hidden}
body{position:relative;background:radial-gradient(70% 70% at 50% 45%,#14245a 0%,#081024 62%,#04070f 100%)}
.bg{position:absolute;inset:0}
/* タートル：414x576（1ドット=9px）。円（半径400）の中に収まるよう中央に */
.turtle{position:absolute;left:193px;top:116px;width:414px;height:576px;image-rendering:pixelated;
  filter:drop-shadow(0 0 22px rgba(60,214,240,.45))}
.guide .ring{position:absolute;left:0;top:0;width:800px;height:800px;border-radius:50%;outline:none;box-shadow:inset 0 0 0 3px #ff5a5a}
.guide .ring2{position:absolute;left:40px;top:40px;width:720px;height:720px;border-radius:50%;box-shadow:inset 0 0 0 3px #ffd84f}
</style></head>
<body>
<svg class="bg" viewBox="0 0 800 800" aria-hidden="true">
  <defs>
    <pattern id="hex" width="80" height="138.56" patternUnits="userSpaceOnUse" patternTransform="translate(0 -10)">
      <path d="M40 0 L80 23.09 L80 69.28 L40 92.38 L0 69.28 L0 23.09 Z M40 92.38 L40 138.56" fill="none" stroke="#3CD6F0" stroke-width="1.4"/>
    </pattern>
    <radialGradient id="fade" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".75" stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="m"><rect width="800" height="800" fill="url(#fade)"/></mask>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3CD6F0" stop-opacity=".30"/><stop offset=".6" stop-color="#3CD6F0" stop-opacity=".08"/><stop offset="1" stop-color="#3CD6F0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="800" fill="url(#hex)" mask="url(#m)" opacity=".5"/>
  <circle cx="400" cy="410" r="330" fill="url(#glow)"/>
  <!-- 円の内側に細いリング（水色→紫） -->
  <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3CD6F0"/><stop offset="1" stop-color="#b9a6ff"/></linearGradient></defs>
  <circle cx="400" cy="400" r="372" fill="none" stroke="url(#rg)" stroke-width="6" opacity=".85"/>
</svg>
<img class="turtle" src="sprites/leader_x9.png" alt="">
<div class="ring"></div><div class="ring2"></div>
</body></html>
